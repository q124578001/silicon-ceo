function applyBossEffects(effects,e){state.bossScandalRisk=clamp(state.bossScandalRisk+(effects.bossRisk||0),0,100);state.bossReputation=clamp(state.bossReputation+(effects.bossRep||0),0,100);state.factionPressure=clamp(state.factionPressure+(effects.faction||0),0,100);state.personalWealth=Math.max(0,state.personalWealth+(effects.personal||0));if(effects.exposed)state.bossExposed=true;if(effects.clearExposure)state.bossExposed=false;if(e.kind==='boss'){state.scandalLog.unshift({year:state.year,month:state.month,day:state.day,title:e.title,risk:state.bossScandalRisk,pressure:state.factionPressure});state.scandalLog=state.scandalLog.slice(0,12);}}
function exposeBoss(reason){state.bossExposed=true;state.bossReputation=clamp(state.bossReputation-12,0,100);state.factionPressure=clamp(state.factionPressure+16,0,100);state.board=clamp(state.board-8,0,100);state.team=clamp(state.team-4,0,100);return `${reason}；老闆聲譽 −12、派系壓力 +16、董事支持 −8、團隊 −4。`;}
function updateBossPolitics(dt){const notes=[];if(!state.bossExposed&&state.bossScandalRisk>=25&&random()<1-Math.pow(1-clamp(.12+state.bossScandalRisk*.006,.12,.8),dt)){notes.push(exposeBoss('老闆過往的利益往來被揭露，反對派開始串聯'));}const pressure=(state.bossExposed?8:0)+Math.max(0,50-state.bossReputation)*.12+state.bossScandalRisk*.06+Math.max(0,40-staffScore('legal'))*.08;state.factionPressure=clamp(Math.round((state.factionPressure+(pressure-2)*dt)*1000)/1000,0,100);if(state.bossExposed){state.board=clamp(Math.round((state.board-5*dt)*1000)/1000,0,100);notes.push(`老闆爭議持續發酵：派系壓力 ${fmt(state.factionPressure)} / 100，董事持續觀望。`);}return notes;}

function riskDepartment(e,o){if(e.dept)return e.dept;if(e.kind==='boss'||e.kind==='conduct')return 'legal';const c=eventCategory(e);if(c==='people')return 'hr';if(c==='governance'||e.id==='patent')return 'legal';if(c==='finance')return 'admin';if(['cyber','cybervendor'].includes(e.id))return 'it';if(e.id==='automation')return 'verification';if(c==='quality')return 'quality';if(c==='supplier')return 'ops';if(c==='engineering')return 'rd';if(['ae-reference','hire-ae'].includes(e.id))return 'ae';if(['fae','customerfailure','hire-fae'].includes(e.id))return 'fae';return /參考設計|評估板|應用驗證/.test(o.label)?'ae':/驗證|支援|規格|應用/.test(o.label)?'fae':'sales';}
function riskFailure(e,dept){if(e.kind==='boss')return {bossRep:-5,bossRisk:8,faction:6};if(dept==='hr')return {team:-3,cash:-2};if(dept==='legal')return {board:-5,conductRisk:5,cash:-2};if(dept==='admin')return {cash:-4,board:-2};if(dept==='it')return {progress:-6,cash:-3};if(['rd','layout','verification','product','ae','quality'].includes(dept))return {progress:-5,tech:-1,cash:-2};if(dept==='ops')return {supplierRel:-4,revenueFactor:.93};return {clientRel:-4,market:-3,revenueFactor:.93};}
function withDecisionRisk(e,original){const o=structuredClone(original);if(o.risk?.rulesVersion===4)return o;const dept=riskDepartment(e,o);if(o.effect.exit==='retired'){o.risk={chance:1,deterministic:true,dept,good:{},bad:{},win:'你正式交出經營權；退休後不能恢復本次任期。',lose:'',rulesVersion:4};return o;}if(o.effect.exit==='acquired'){delete o.effect.exit;o.risk={chance:.82,dept:'legal',good:{exit:'acquired'},bad:{cash:-3,board:-5},win:'盡職調查與交割通過，你正式交出公司經營權。',lose:'交割條件未談攏，收購未完成，顧問費與董事疑慮留下來。',rulesVersion:4};return o;}
if(o.risk){o.risk={...o.risk,dept,rulesVersion:4};return o;}o.risk={chance:.79,dept,good:{},bad:riskFailure(e,dept),win:`${departments[dept].name}完成「${o.label}」，但後續仍須追蹤。`,lose:`${departments[dept].name}執行「${o.label}」遇到阻礙，追加代價與後續壓力。`,rulesVersion:4};return o;}
function effectSummary(effect){const labels={cash:'公司現金',tech:'技術',team:'團隊',market:'市場',progress:'專案進度',products:'量產產品',board:'董事支持',supplierRel:'上游信任',supplierCapacity:'供貨產能',clientRel:'客戶信任',clientOrders:'客戶商機',conductRisk:'公司爭議風險',bossRisk:'老闆風險',bossRep:'老闆聲譽',faction:'派系壓力',personal:'個人資產',equity:'持股百分點'};const a=[];for(const [k,v]of Object.entries(effect||{})){if(!v)continue;if(labels[k])a.push(labels[k]+' '+(k==='personal'&&v<-999?'歸零':signed(v)));else if(k.startsWith('hire')){const map={hireRd:'rd',hireLayout:'layout',hireVerification:'verification',hireProduct:'product',hireFae:'fae',hireAe:'ae',hireSales:'sales',hireMarketing:'marketing',hireOps:'ops',hireQuality:'quality',hireAdmin:'admin',hireHr:'hr',hireLegal:'legal',hireIt:'it'};if(map[k])a.push(departments[map[k]].name+' '+signed(v)+' 人（後續薪資改變）');}else if(k==='revenueFactor')a.push('本期營收 ×'+v);else if(k==='marginShift')a.push('毛利率 '+signed(Math.round(v*100))+' 百分點');else if(k==='defer')a.push('本期款項遞延 '+Math.round(v*100)+'%');else if(k==='contractYears')a.push('合約 '+v+' 年');else if(k==='contractFactor')a.push('合約期營收 ×'+v);else if(k==='listed')a.push('完成上市');else if(k==='exposed')a.push('老闆爭議公開');else if(k==='clearExposure')a.push('結束本輪公開爭議');else if(k==='exit')a.push(v==='acquired'?'完成收購並結束任期':'正式退休並結束任期');}return a.join('、')||'無額外數值變動';}
function riskDescription(o){const r=o.risk;if(!r)return esc(o.hint);const chance=Math.round(eventChance(r)*100);return `<span class="choice-risk-head"><span>${esc(departments[r.dept]?.name||'主管協調')}負責</span><strong class="${chance<60?'warn':'good'}">${r.deterministic?'確定交棒':`順利率 ${chance}%`}</strong></span><span class="chance-track" role="progressbar" aria-label="選項執行順利率" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${chance}"><i style="width:${chance}%"></i></span><span class="choice-effect"><em>固定</em>${esc(effectSummary(o.effect))}</span>${Object.keys(r.good||{}).length?`<span class="choice-effect"><em>順利</em>${esc(effectSummary(r.good))}</span>`:''}<span class="choice-effect adverse"><em>${r.deterministic?'代價':'受阻'}</em>${r.deterministic?'結束本次任期，不能再繼續經營':esc(effectSummary(r.bad))}</span>`;}

function chooseStoryEvent(pool){const weighted=[];for(const e of pool){let weight=1;const axis=storyAxis(riskDepartment(e,{label:''})),v=state.storyState[axis];if(v<-15)weight+=2;if(v>20&&['hit','award','designwin','niche','listing','campus-hire'].includes(e.id))weight+=2;for(let i=0;i<weight;i++)weighted.push(e);}return pick(weighted);}

function storyPanel(){if(!state.storyJournal.length)return '';return `<details class="org-card story-routes"><summary><span>決策與劇情路線</span><b>${state.storyQueue.length} 條待續</b></summary><p class="org-caption">−100 至 +100，0 是中性。累積路線會改變未來事件。</p>${Object.entries(storyAxes).map(([k,n])=>meter(n,state.storyState[k],{min:-100,max:100,display:signed(state.storyState[k]),unit:'',center:true,color:state.storyState[k]<0?'warn':'good',compact:true})).join('')}<p class="hint">${esc(state.storyJournal[0].text)}</p>${state.storyQueue.slice(0,4).map(t=>`<div class="thread-item"><b>${esc(t.sourceTitle)}</b><small>${t.due<=state.elapsedDays?'已進入處理窗口':`約 ${Math.ceil(t.due-state.elapsedDays)} 天後進入處理窗口`}</small></div>`).join('')}</details>`;}

function financeChance(key){return key==='loan'?clamp(.55+state.market*.003+state.tech*.002-state.debt*.003+(staffScore('admin')-65)*.002,.18,.9):clamp(.28+state.tech*.004+state.market*.003-state.crisis.attempts*.08+(staffScore('admin')-65)*.002,.2,.9);}
function syncFinance(text,before){if(state.result&&state.crisis?.resume!=='turn'){state.result.financing??=[];state.result.financing.push(text);for(const k of ['cash','tech','team','market','products'])state.result.delta[k]+=state[k]-before[k];if(state.history[0]?.year===state.result.year)state.history[0]=structuredClone(state.result);}}
function resolveCrisis(key){if(!state||state.stage!=='crisis')return;const c=state.crisis;if(key==='close'){state.alive=false;state.endType='closed';state.failureReason='董事會決定停止營業，結清剩餘資產。';state.stage='end';save();render();return;}if(key==='continue'){if(state.cash>=c.needed){const resume=c.resume;state.crisis=null;if(resume==='result'&&state.governanceDue){state.stage='board';save();render();}else if(resume==='result'){autoAdvance();}else{state.stage='turn';prepareAnnualEvent();}}return;}if(!crisisAvailable(key))return;
const before={cash:state.cash,tech:state.tech,team:state.team,market:state.market,products:state.products};const approval=(key==='loan'||key==='equity')?financeChance(key):0;let message='';c.used.push(key);c.attempts++;
if(key==='loan'){if(random()<approval){state.cash+=40;state.debt+=40;message='銀行核准週轉金 40；往後每年支付 8% 利息及 15% 本金。';}else{state.market=clamp(state.market-3,0,100);message='銀行拒絕授信。沒有取得資金，市場信任下降 3。';}}
if(key==='equity'){if(random()<approval){state.cash+=60;state.equity=Math.round(state.equity*.7);message=`募資成功，資金 +60；創辦人持股稀釋為 ${state.equity}%。`;}else{state.team=clamp(state.team-5,0,100);message='投資人撤回條件書。沒有取得資金，團隊狀態下降 5。';}}
if(key==='cut'){state.cash+=16;state.overheadCut=Math.min(10,state.overheadCut+5);for(const dept of Object.keys(state.staff))state.staff[dept]=Math.max(dept==='admin'?1:0,Math.floor(state.staff[dept]*.8));state.team=clamp(state.team-20,0,100);state.tech=clamp(state.tech-7,0,100);state.market=clamp(state.market-5,0,100);message='出售設備並縮編：資金 +16，往後固定費降低；團隊 −20、技術 −7、市場 −5。';}
if(key==='license'){state.cash+=28;state.products--;reconcileProductLines();state.market=clamp(state.market-7,0,100);message='售出一款產品的權利：資金 +28、量產產品 −1、市場 −7。往後失去這款產品的營收。';}
c.messages.push(message);syncFinance(message,before);
const exhausted=c.attempts>=2||!['loan','equity','license','cut'].some(crisisAvailable);
if(state.team<=0){state.alive=false;state.endType='team';state.failureReason='縮編與融資壓力讓團隊瓦解，公司無法繼續營運。';state.stage='end';}
else if(exhausted&&state.cash<=0){state.alive=false;state.endType='bankrupt';state.failureReason='可用的自救機會已耗盡，仍無法支付到期款項，公司宣告倒閉。';state.stage='end';}
else if(exhausted&&state.cash<c.needed){c.messages.push('已用完本輪自救機會。公司仍有少量現金，可帶著高風險繼續營運。');c.needed=1;}
if(state.stage==='crisis'&&state.cash>=c.needed){state.lastCrisisNote=c.messages.join(' ');resolveCrisis('continue');return;}save();render();}
function prepareAnnualEvent(){if(!state||state.stage==='end'||checkAgeRetirement())return;state.stage='turn';const key=state.strategy==='auto'?autoFocus():state.strategy;runYear(state.cash<focusCost(key)?'cash':key,state.strategy==='auto');}
function autoAdvance(){const date=new Date(Date.UTC(state.year,state.month-1,state.day));date.setUTCDate(date.getUTCDate()+(state.result?.days||Math.round((state.result?.months||12)*365.25/12)));state.year=date.getUTCFullYear();state.month=date.getUTCMonth()+1;state.day=date.getUTCDate();state.pending=null;state.crisis=null;state.governanceDue=false;prepareAnnualEvent();save();render();window.scrollTo({top:0,behavior:'smooth'});}
function nextYear(){if(state?.stage==='result')autoAdvance();}
function changeStrategy(key){if(state?.stage!=='event'||!(key==='auto'||focuses[key])||(focuses[key]&&state.cash<focusCost(key)))return;state.strategy=key;const focus=key==='auto'?autoFocus():key;state.pending.key=focus;state.pending.auto=key==='auto';save();render();}
function scene(){return '<div class="scene" aria-label="IC 設計公司辦公室插畫" role="img"><div class="window"></div><div class="desk"></div><div class="monitor"></div><div class="character"></div><div class="leaves"></div><div class="plant"></div><span class="scene-note">LIFE IN YOUR COMPANY</span></div>';}

function meter(label,value,opts={}){const min=opts.min??0,max=opts.max??100,n=Number.isFinite(Number(value))?Number(value):0,bounded=clamp(n,min,max),percentage=(bounded-min)/(max-min)*100,color=opts.color||(opts.danger?(n>=60?'danger':n>=30?'warn':'good'):(n>=70?'good':n>=40?'warn':'danger'));return `<div class="metric ${color}${opts.compact?' compact':''}"><div class="metric-top"><span>${esc(label)}</span><strong>${esc(opts.display??fmt(n))}<small>${esc(opts.unit??' / 100')}</small></strong></div><div class="metric-track" role="progressbar" aria-label="${esc(label)}" aria-valuemin="${min}" aria-valuemax="${max}" aria-valuenow="${bounded}" aria-valuetext="${esc(opts.aria??((opts.display??fmt(n))+(opts.unit??' / 100')))}"><i style="width:${percentage.toFixed(1)}%"></i>${opts.center?'<em></em>':''}</div>${opts.note?`<p class="metric-note">${esc(opts.note)}</p>`:''}</div>`;}
function retirementMeter(){const passed=clamp(bossAge()-state.bossStartAge,0,state.retirementAge-state.bossStartAge),span=state.retirementAge-state.bossStartAge;return meter('老闆的經營人生',passed,{max:span,display:bossAge()+' 歲',unit:'',color:'neutral',note:state.retirementAge+' 歲退休 · '+retirementDate(),aria:`目前 ${bossAge()} 歲，${state.retirementAge} 歲退休`});}
function dashboardHeader(){return `<div class="companyline"><div><span class="eyebrow">SILICON CEO · 公司經營室</span><h1>${esc(state.name)}</h1><p>${state.year} 年 ${state.month} 月 ${state.day} 日<span>經營第 ${Math.max(1,state.age+1)} 年</span></p></div><div class="company-tags"><span>${totalStaff()} 位員工</span><span>${state.products} 款量產</span><span>${state.listed?'已公開上市':'獨立經營'}</span>${state.year>LAST_REAL_YEAR?'<span>虛構未來</span>':''}</div></div>`;}

function stats(){const annualFixed=Math.max(10,8+payrollCost()+state.products*1.5-state.overheadCut),months=Math.max(0,state.cash/(annualFixed/12));return `<section class="dashboard-kpis" aria-label="公司核心狀態"><article class="kpi-card cash-card"><div class="kpi-heading"><span>公司可用資金</span><span class="kpi-symbol">◈</span></div><div class="cash-value">${moneyText(state.cash)}<small>百萬元</small></div>${meter('固定支出緩衝',Math.min(months,6),{max:6,display:months.toFixed(1),unit:' 個月',color:months<2?'danger':months<4?'warn':'good',note:'進度條以 6 個月為目標；未計未來收入、製造成本及還款',aria:`現金可支撐約 ${months.toFixed(1)} 個月固定支出，目標六個月`})}</article><article class="kpi-card">${meter('技術實力',state.tech,{note:'影響研發、驗證與技術決策'})}</article><article class="kpi-card">${meter('團隊狀態',state.team,{note:'偏低可能離職；歸零將無法營運'})}</article><article class="kpi-card">${meter('市場地位',state.market,{note:'影響訂單、客戶開發與募資'})}</article></section>`;}
function turnCard(){const w=world[state.year];return `<div class="sim-grid"><div><div class="paper event">${scene()}<div class="event-meta"><span>公司第 ${state.age+1} 年</span><span>${state.year} 年</span></div>${w?`<div class="world-badge">◎ 真實時代背景</div><h2>${w.title}</h2><p class="story">${w.text}</p><a class="source" href="${w.url}" target="_blank" rel="noopener">事件資料：${w.source} ↗</a>`:`<h2>${state.year} 年，你要把力氣放在哪裡？</h2><p class="story">市場仍在變化。資源有限，你只能選擇一項年度經營重心。</p>`}<h3 class="choose-title">選擇今年的經營重心</h3><div class="focuses">${Object.entries(focuses).map(([k,f])=>`<button class="focus" data-focus="${k}" ${''}><span>${f.icon}</span><b>${f.name}</b><small>${state.cash<f.cost?'資金不足 · 點選處理週轉危機':f.desc}</small></button>`).join('')}</div><button class="fate" data-auto>✦ 交給命運替我決定這一年</button></div>${timeline()}</div><aside class="right-rail">${peers()}${revenuePanel()}${governancePanel()}<div class="paper mini"><small>研發中的下一顆 IC</small><b>${state.progress}%</b><div class="progress"><i style="width:${clamp(state.progress,0,100)}%"></i></div><p>${state.products} 款產品量產中。技術與團隊會影響產品成功率。</p></div></aside></div>`;}
function resultCard(){const r=state.result,e=r.world||r.generic;return `<div class="sim-grid"><div><div class="paper event"><div class="result-label">${r.year} 年度報告</div><h2>${r.auto?'命運替你選擇：':''}${r.focusName}</h2><p class="story">${r.focusText}</p>${e?`<div class="year-event"><small>${r.world?'真實世界事件':'這一年發生的事'}</small><b>${e.title}</b><p>${e.text}</p>${r.world?`<a class="source" href="${e.url}" target="_blank" rel="noopener">事件資料：${e.source} ↗</a>`:''}</div>`:''}${r.world&&r.generic?`<div class="year-event"><small>公司隨機事件 · ${esc(r.eventChoice||'')}</small><b>${esc(r.generic.title)}</b><p>${esc(r.generic.text)}</p></div>`:''}${annualFinancials(r)}${changes(r.delta)}${r.financing?.length?`<div class="rescue-log">${r.financing.map(x=>`<p>${esc(x)}</p>`).join('')}</div>`:''}<div class="settlement">年度營業損益 ${signed(r.operation)}；還本金、收款與遞延後的營運現金流 ${signed(r.cashFlow??r.operation)} 百萬元。上方資金變化另含策略、事件及危機籌資。</div><button class="primary" data-next>前往 ${state.year+1} 年 →</button></div>${timeline()}</div><aside class="right-rail">${peers()}${revenuePanel()}${governancePanel()}</aside></div>`;}
function ending(){const types={
ageRetired:['屆齡退休','到了把公司交棒的年紀。','你達到開局設定的退休年齡，完成本次老闆人生。公司由接班人繼續經營。'],
retired:['主動退休','這一次，你決定把時間留給自己。','公司仍在運作，你選擇交棒，結束自己的經營任期。'],
acquired:['策略收購','你簽下收購協議，故事換了一位主角。','產品與團隊加入新的公司，你不再握有經營權。'],
ousted:['被迫下台','董事會通過了更換負責人的決議。','公司沒有倒閉，但你失去經營權。創辦公司的名字，仍然留在那面牆上。'],
team:['團隊離散','辦公室慢慢安靜下來。','關鍵人員離開，已經無法維持交付與研發。'],
closed:['主動停業','你選擇在這裡停止營業。','清理債務與剩餘資產，也是創業者必須面對的決定。'],
bankrupt:['公司倒閉','公司已經無法支付到期款項。','自救沒有成功，公司停止營運。下一次創業，你會記得這段經驗。']};
const [badge,title,desc]=types[state.endType]||(!state.alive?types.bankrupt:types.retired);
return `<div class="sim-grid"><div><div class="paper ending"><div class="eyebrow">YOUR FOUNDER STORY</div><div class="big">▦</div><span class="award">${badge}</span><h2>${title}</h2><p>${esc(state.name)} · ${state.startYear}–${state.year} · 經營 ${Math.floor(state.elapsedDays/365.25)} 年 ${Math.floor(state.elapsedDays%365.25)} 天</p><p>${esc(state.failureReason||desc)}</p><p class="hint">老闆 ${bossAge()} 歲 · 公司${state.alive?'仍在營運':'已停止營運'} · ${state.listed?'曾完成上市':'獨立經營歷程'}</p>${state.result?`<div class="year-event" style="text-align:left"><small>最近一期 · ${state.result.year} 年 ${state.result.month||1} 月</small><b>${esc(state.result.generic?.title||'年度營運')}</b><p>${esc(state.result.generic?.text||state.result.focusText)}</p></div>${annualFinancials(state.result)}`:''}${state.crisis?.messages.length?`<div class="rescue-log" style="text-align:left">${state.crisis.messages.map(m=>`<p>${esc(m)}</p>`).join('')}</div>`:''}<p class="hint">未償借款 ${fmt(state.debt)} · 創辦人持股 ${state.equity}%</p><div class="ending-stats"><span>資金 <b>${fmt(state.cash)}</b></span><span>技術 <b>${state.tech}</b></span><span>團隊 <b>${state.team}</b></span><span>產品 <b>${state.products}</b></span></div><button class="primary" data-new>再成立一家公司 →</button></div>${timeline()}</div><aside class="right-rail">${peers()}${governancePanel()}</aside></div>`;}
function startScreen(){const yearOptions=Array.from({length:22},(_,i)=>2000+i).map(y=>`<option value="${y}" ${y===2020?'selected':''}>${y} 年${world[y]?` · ${world[y].title}`:''}</option>`).join('');return `<section class="intro"><div class="eyebrow">ONE COMPANY AMONG THOUSANDS</div><h1>如果你在另一個年代<br>創立一家 IC 公司。</h1><p>你可以選擇名字與時代。老闆起始年齡隨機為 40～55 歲，70 歲退休。<br>創辦人、資金、產品方向與運氣，由世界決定。</p></section><div class="paper start">${scene()}<form id="startForm"><label for="companyName">公司名稱</label><input class="input" id="companyName" maxlength="24" placeholder="例如：芯程半導體" required><label for="startYear" style="margin-top:18px">成立年份</label><select class="input" id="startYear">${yearOptions}</select><div class="random-field"><span>∞</span><div><b>沒有固定任期</b><small>持續經營，直到倒閉、主動或屆齡退休、被迫下台或接受收購。2026 年起使用虛構未來事件推演。</small></div></div><p class="hint">年代事件依公開資料整理；遊戲中的財務與機率為簡化模擬。</p><p class="hint error" id="nameError"></p><button class="primary" type="submit">抽取公司的起點 →</button></form></div>`;}
function render(){const running=!!state;$('rename').hidden=!running;$('restart').hidden=!running;$('retire').hidden=!running||!['turn','event','result'].includes(state.stage);if(!state){$('app').innerHTML=startScreen();return;}const body=state.stage==='profile'?profileCard():state.stage==='turn'?turnCard():state.stage==='event'?businessCard():state.stage==='crisis'?crisisCard():state.stage==='board'?boardCard():state.stage==='result'?resultCard():ending();$('app').innerHTML=`${dashboardHeader()}${stats()}${body}${['profile','event'].includes(state.stage)?'':`<section class="management-bottom">${organisationDashboard()}${storyPanel()}${ambientPanel()}</section>`}`;}
function annualFinancials(r){if(r.revenue==null)return '';return `<div class="financial-hero"><div><small>本期營收 · 百萬元</small><strong>${fmt(r.revenue)}</strong><span class="${(r.yoy||0)>=0?'up':'down'}">${r.yoy==null?'首期營收':`年化較前期 ${signed(r.yoy)}%`}</span></div><div><small>營業損益</small><b class="${r.operation>=0?'up':'down'}">${signed(r.operation)}</b><small>毛利率 ${r.grossMargin}%</small></div></div>${r.revenueModel?`<div class="revenue-mix"><span>量產出貨<b>${fmt(r.revenueModel.production)}</b></span><span>工程樣品<b>${fmt(r.revenueModel.samples)}</b></span><span>設計／服務<b>${fmt(r.revenueModel.services)}</b></span></div>`:''}<div class="finance-breakdown"><span>製造成本 <b>${fmt(r.cogs)}</b></span><span>固定費用 <b>${fmt(r.overhead)}</b></span>${r.projectExpense?`<span>專案改版／結案費 <b>${fmt(r.projectExpense)}</b></span>`:''}<span>借款利息 <b>${fmt(r.interest)}</b></span><span>償還本金 <b>${fmt(r.principal)}</b></span></div>${r.deferred||r.collected||r.badDebt?`<p class="hint">遞延收款 ${fmt(r.deferred)} · 收回前期款 ${fmt(r.collected)} · 前期壞帳 ${fmt(r.badDebt)}</p>`:''}`;}
function revenuePanel(){const a=[...state.history].reverse().filter(h=>h.revenue!=null).map(h=>({...h,revenue:Math.round(h.revenue*12/(h.months||12))}));const max=Math.max(1,...a.map(h=>h.revenue));const pts=a.map((h,i)=>`${10+i*160/Math.max(1,a.length-1)},${77-h.revenue/max*60}`);return `<div class="paper mini"><small>年化營收走勢 · 百萬元</small><b>${state.lastRevenue==null?'尚未結算':fmt(state.lastRevenue)}</b>${a.length?`<svg viewBox="0 0 180 90" role="img" aria-label="歷年營收趨勢" class="revenue-chart"><path d="M10 78H170" stroke="#dce3d4"/><polyline points="${pts.join(' ')}" fill="none" stroke="#497c59" stroke-width="3"/>${pts.map(p=>{const[x,y]=p.split(',');return `<circle cx="${x}" cy="${y}" r="3" fill="#497c59"/>`;}).join('')}</svg>`:''}<p>未償借款 ${fmt(state.debt)}<br>創辦人持股 ${state.equity}%</p></div>`;}
function businessCard(){const p=state.pending,e=pendingEvent(),available=state.cash-focusCost(p.key),actor=partnerByActor(p.actor);return `<div class="workspace"><section class="decision-column"><article class="paper event decision-panel"><div class="decision-top"><span class="section-kicker">${p.thread?'決策的後續':'等待你的決策'}</span><span class="time-badge">時間已停止 · 請選擇</span></div><div class="event-meta"><span>${actor?`${p.actor.type==='supplier'?'上游供應商':'下游客戶'} · ${esc(actor.name)}`:e.kind==='boss'?'老闆本人與經營權':e.kind==='conduct'?'公司治理與人事':'公司經營事件'}</span></div><h2>${esc(e.title)}</h2>${projectContext()}${p.thread?`<div class="actor-box"><b>延續：${esc(p.thread.sourceTitle)}</b><span>你先前選擇「${esc(p.thread.choice)}」· ${p.thread.success?'執行順利':'執行受阻'}</span></div>`:''}<p class="story">${esc(shortEventText(e))}</p>${shortEventText(e)!==e.text?`<details class="event-background"><summary>查看完整背景</summary><p>${esc(e.text)}</p></details>`:''}${actor?`<div class="counterparty"><span>${esc(actor.name)}<small>${esc(actor.role)}</small></span>${meter('信任',actor.trust,{compact:true})}</div>`:''}<div class="decision-settings">${strategyPicker()}${yearContext()}</div><div class="choices">${e.options.map((o,i)=>{const can=available>=Math.max(0,-(o.effect.cash||0));return `<button class="choice" data-event-choice="${i}" data-event-token="${p.token}" ${can?'':'disabled'}><span class="choice-letter">${String.fromCharCode(65+i)}</span><span class="choice-content"><b>${esc(o.label)}</b><small>${can?riskDescription(o):'扣除本階段策略後，現金不足'}</small></span></button>`;}).join('')}<button class="choice defer-choice" data-defer-event data-event-token="${p.token}"><span class="choice-letter">${String.fromCharCode(65+e.options.length)}</span><span class="choice-content"><b>暫緩處理，不追加一次性支出</b><small><span class="choice-risk-head"><span>延後決策</span><strong class="warn">確定承擔代價</strong></span><span class="choice-effect adverse"><em>固定</em>本期營收 ×0.6、團隊 −8、市場 −6</span><span class="choice-effect"><em>後續</em>事件可能惡化；策略與營運費 function resolveCrisis(key){if(!state||state.stage!=='crisis')return;const c=state.crisis;if(key==='close'){finish('closed','你決定停止營業，清理公司的剩餘資產與債務。');return;}if(key==='continue'){if(state.cash<c.needed)return;state.crisis=null;state.nextCrisisAt=state.elapsedDays+30;if(state.governanceDue)state.stage='board';else state.stage=state.pending?'event':'running';save();render();return;}if(!crisisAvailable(key))return;const before=state.cash,approval=['loan','equity'].includes(key)?financeChance(key):0;c.used.push(key);c.attempts++;let message='';if(key==='loan'){if(random()<approval){state.cash+=40;state.debt+=40;message='銀行核准 40，未來利息與本金按日支付。';}else{state.market=clamp(state.market-3,0,100);message='授信未通過，市場 −3。';}}if(key==='equity'){if(random()<approval){state.cash+=60;state.equity=Math.round(state.equity*.7);message='募資 60，持股稀釋至 '+state.equity+'%。';}else{state.team=clamp(state.team-5,0,100);message='投資人撤回，團隊 −5。';}}if(key==='cut'){state.cash+=16;state.overheadCut=Math.min(10,state.overheadCut+5);for(const d of Object.keys(state.staff))state.staff[d]=Math.max(d==='admin'?1:0,Math.floor(state.staff[d]*.8));state.team=clamp(state.team-20,0,100);state.tech=clamp(state.tech-7,0,100);state.market=clamp(state.market-5,0,100);message='出售設備與縮編，現金 +16；能力和士氣下降。';}if(key==='license'){state.cash+=28;state.products--;reconcileProductLines();state.market=clamp(state.market-7,0,100);message='出售一款產品權利，現金 +28，未來失去該產品營收。';}c.messages.push(message);bookOneOff(state.cash-before,message,['loan','equity'].includes(key));if(state.team<=0){finish('team','縮編壓力讓團隊瓦解。');return;}const exhausted=c.attempts>=2||!['loan','equity','license','cut'].some(crisisAvailable);if(exhausted&&state.cash<=0){finish('bankrupt','資金已耗盡，緊急自救未能支付到期支出。');return;}if(exhausted&&state.cash<c.needed)c.needed=1;if(state.cash>=c.needed){resolveCrisis('continue');return;}save();render();}
function resolveBoard(key){if(!state||state.stage!=='board')return;if(key==='retire'){finish('retired','董事會表決前，你決定主動退休。');return;}if(key==='negotiate'){if(state.cash<12)return;state.cash-=12;bookOneOff(-12,'董事會改革與補償');state.equity=Math.max(5,state.equity-8);state.board=58;state.team=Math.max(0,state.team-6);}else if(key==='vote'){if(random()>=boardOdds()){finish('ousted','董事會撤換了你。公司繼續經營，但你的任期結束。');return;}state.board=62;state.team=Math.max(0,state.team-4);}else return;state.governanceDue=false;state.factionPressure=clamp(state.factionPressure-18,0,100);state.boardCooldown=2;if(state.team<=0){finish('team','派系衝突讓團隊無法繼續運作。');return;}if(state.cash<19){startCrisis('running');return;}state.stage=state.pending?'event':'running';save();render();}

// Staffing decisions use actual payroll, project capability and political consequences.
const payrollBeforeTalent=payrollCost;
payrollCost=function(){return Math.round((payrollBeforeTalent()+Object.values(state.talentPremium||{}).reduce((a,b)=>a+b,0))*100)/100;};
const graphBeforeTalent=graphInit;

function talentNote(text){state.talentLog.unshift({date:`${state.year}/${state.month}/${state.day}`,text});state.talentLog=state.talentLog.slice(0,30);state.realtimeNotes.unshift({year:state.year,month:state.month,day:state.day,text});}
function talentQuote(dept,count){const d=departments[dept];return {severance:rtMoney(d.cost*count/4),fee:rtMoney(d.cost*count*.18),salary:rtMoney(d.cost*count*1.3/12),chance:clamp(.38+staffScore('hr')*.003+state.bossReputation*.002-state.factionPressure*.002,.15,.85)};}
function talentDialog(){if(!state||!['running','event'].includes(state.stage))return;modal(`<h2>人力調整與競業挖角</h2><p>開啟視窗時時間暫停。調整會改變薪資、部門執行力與專案進度。</p><label for="talentDept">部門</label><select id="talentDept" class="input">${Object.entries(departments).map(([k,d])=>`<option value="${k}">${esc(d.name)} · ${state.staff[k]} 人</option>`).join('')}</select><label for="talentCount">人數</label><select id="talentCount" class="input"><option value="1">1 人</option><option value="3">3 人</option><option value="5">5 人</option></select><div id="talentQuote"></div><button class="primary" data-talent-action="layoff">執行裁員</button><button class="primary" data-talent-action="poach">委託挖角</button><p id="talentError" role="alert"></p><button class="text-btn" data-close>保留現有人力</button>`);updateTalentQuote();}
function updateTalentQuote(){if(!$('talentDept').value)return;const dept=$('talentDept').value,n=Number($('talentCount').value),q=talentQuote(dept,n);$('talentQuote').innerHTML=`<p><b>裁員：</b>資遣費 ${moneyText(q.severance)}；每月減少基本薪資 ${moneyText(departments[dept].cost*n/12)}。士氣 −${3+n*2}、派系壓力 +${n*2}；相關專案進度可能退後。</p><p><b>挖角：</b>先付招募費 ${moneyText(q.fee)}，14～45 天後揭曉；成功機率 ${Math.round(q.chance*100)}%。成功後每月增加薪資 ${moneyText(q.salary)}（含 30% 溢價）。失敗不退招募費；成功仍有 25% 融入風險。</p><p>金額單位：百萬元。同時限一筆挖角；每次人事操作後須間隔 30 天。</p>`;}
function submitTalent(action){const out=performTalent(action,$('talentDept').value,Number($('talentCount').value));if(out.ok){$('dialog').close();save();render();}else $('talentError').textContent=out.message;}
function performTalent(action,dept,n,alreadyPaid=false){const fail=message=>({ok:false,message});if(!state||!['running','event'].includes(state.stage)||!departments[dept]||![1,3,5].includes(n)||!['layoff','poach'].includes(action))return fail('此時無法調整人力。');if(state.elapsedDays<state.talentCooldown)return fail(`人事整合中，還需 ${state.talentCooldown-state.elapsedDays} 天。`);const q=talentQuote(dept,n),cost=action==='layoff'?q.severance:q.fee;if(!alreadyPaid&&state.cash<cost)return fail('現金不足以支付本次費用。');if(action==='layoff'&&(state.staff[dept]<n||totalStaff()<=n))return fail('部門人數不足，或裁員後將無人營運。');if(action==='poach'&&state.talentSearch)return fail('目前已有一筆挖角委託。');if(action==='poach'&&state.staff[dept]+n>100)return fail('此部門已達人數上限。');if(!alreadyPaid){state.cash=rtMoney(state.cash-cost);bookOneOff(-cost,action==='layoff'?'資遣費':'挖角招募費');}state.talentCooldown=state.elapsedDays+30;state.talentSerial++;if(action==='layoff'){const old=state.staff[dept];state.staff[dept]-=n;state.talentPremium[dept]=(state.talentPremium[dept]||0)*state.staff[dept]/old;state.team=clamp(state.team-3-n*2,0,100);state.factionPressure=clamp(state.factionPressure+n*2,0,100);state.board=clamp(state.board-2,0,100);if(['rd','layout','verification','ae','fae','product','ops','quality'].includes(dept))for(const p of state.projects)p.progress=Math.max(0,p.progress-n*1.5);talentNote(`${departments[dept].name} 裁員 ${n} 人，資遣費 ${moneyText(cost)}；薪資降低，士氣與專案交接承壓。`);}else{state.talentSearch={dept,count:n,chance:q.chance,due:state.elapsedDays+14+Math.floor(random()*32)};talentNote(`委託挖角 ${departments[dept].name} ${n} 人，先付招募費 ${moneyText(cost)}；結果尚未揭曉。`);}if(state.team<=0)finish('team','反覆縮編讓團隊失去信任，公司無法繼續營運。');return {ok:true};}
function talentDaily(){const search=state.talentSearch;if(search&&state.elapsedDays>=search.due){state.talentSearch=null;const d=departments[search.dept],n=Math.min(search.count,100-state.staff[search.dept]);if(random()<search.chance&&n>0){state.staff[search.dept]+=n;state.talentPremium[search.dept]=(state.talentPremium[search.dept]||0)+d.cost*n*.3;const friction=random()<.25;state.team=clamp(state.team+(friction?-6:3),0,100);state.factionPressure=clamp(state.factionPressure+(friction?9:2),0,100);if(['rd','layout','verification','ae'].includes(search.dept))state.tech=clamp(state.tech+n,0,100);talentNote(`挖角成功：${d.name} ${n} 人報到，新增薪資與 30% 溢價。${friction?'薪資落差引發內部不滿，士氣 −6、派系 +9。':'交接順利，士氣 +3、派系 +2。'}`);}else{state.suppliers[0].trust=clamp(state.suppliers[0].trust-2,0,100);talentNote(`挖角失敗：${d.name} 候選人接受原公司慰留，招募費不退；競業傳聞使供應商信任 −2。`);}}
if(state.elapsedDays>0&&state.elapsedDays%30===0&&random()<clamp(.04+(55-state.team)*.004+state.factionPressure*.001,.02,.35)){const keys=Object.keys(departments).filter(k=>state.staff[k]>0);if(keys.length){const k=pick(keys),old=state.staff[k];state.staff[k]--;state.talentPremium[k]=(state.talentPremium[k]||0)*(old-1)/old;state.team=clamp(state.team-2,0,100);state.factionPressure=clamp(state.factionPressure+3,0,100);talentNote(`競業挖走 ${departments[k].name} 1 人；團隊 −2、派系 +3，該部門執行力降低。`);}}}

);

drawAlternatives=function(e){if(!e.id.startsWith('personnel-'))return alternativesBeforePersonnel(e);const layoff=e.id==='personnel-layoff',keys=Object.keys(departments).filter(k=>layoff?state.staff[k]>=1&&totalStaff()>state.staff[k]:state.staff[k]<98),dept=layoff?[...keys].sort((a,b)=>state.staff[b]*departments[b].cost-state.staff[a]*departments[a].cost)[0]:[...keys].sort((a,b)=>staffScore(a)-staffScore(b))[0];if(!dept)return [eventOption('保留目前組織','士氣 +1；薪資與執行力維持',{team:1})];const name=departments[dept].name,make=n=>{const q=talentQuote(dept,n),cash=layoff?q.severance:q.fee;return {label:layoff?`${name}縮編 ${n} 人`:`挖角 ${name} ${n} 人`,hint:layoff?`資遣費 ${moneyText(cash)}；每月基本薪資減少 ${moneyText(departments[dept].cost*n/12)}。士氣 −${3+n*2}、派系 +${n*2}、董事 −2；研發相關部門裁員使各案進度 −${n*1.5}。`:`先付 ${moneyText(cash)}，14～45 天後揭曉；成功率 ${Math.round(q.chance*100)}%。成功後月薪增加 ${moneyText(q.salary)}；失敗不退費，成功仍有 25% 融入風險。`,effect:{cash:-cash,talentAction:layoff?'layoff':'poach',talentDept:dept,talentCount:n},personnel:true};};const max=layoff?Math.min(state.staff[dept],totalStaff()-1):100-state.staff[dept],nums=[1,3,5].filter(n=>n<=max),first=make(nums[0]),second=make(nums[nums.length-1]);const keep=withDecisionRisk(e,eventOption(layoff?'暫不裁員，保留團隊':'不追逐高薪人才，培養現有人員',layoff?'團隊 +3，薪資維持':'支出 2、技術 +2、團隊 +3',layoff?{team:3}:{cash:-2,tech:2,team:3}));return nums.length>1?[first,second,keep]:[first,keep];};

runYear=function(key,auto=false){runBeforeProjectStory(key,auto);if(!state?.pending||state.stage!=='event')return;const pending=state.pending,e=businessEvents.find(e=>e.id===pending.eventId);let id=pending.thread?.projectId;const isClient=pending.actor?.type==='client'||e.kind==='client';if(!id&&isClient){const production=['recall','cancel','hit','pricewar','longsupport','receivable','exclusive','award','distributor','export'].includes(e.id),choices=production?state.productLines:e.id==='designwin'?state.projects.filter(p=>p.progress>=90):state.projects;id=(choices.length?pick(choices):pick(state.projects))?.id;}if(!id&&['rd','layout','verification','ae','fae','quality','product'].includes(e.dept))id=pick(state.projects)?.id;if(id&&projectRef(id)){pending.projectId=id;const p=projectRef(id);if(isClient||pending.thread?.lifecycle)pending.actor={type:'client',id:p.clientId};}save();};
const recordBeforeProjectStory=recordDecisionStory;
recordDecisionStory=function(e,o,success,effects){const id=state.pending.projectId||state.pending.thread?.projectId;if(id)effects.projectId=id;const entry=recordBeforeProjectStory(e,o,success,effects);if(id){entry.projectId=id;entry.clientId=projectRef(id)?.clientId;const p=projectRef(id);entry.text+=` · ${p?.name||id}（${id}）`;projectStory(id,`${e.title}：${o.label}；${success?'執行順利':'執行受阻'}。`);const thread=state.storyQueue.find(t=>t.id===entry.threadId);if(thread&&state.pending.actor?.type==='client'){thread.projectId=id;thread.lifecycle=true;thread.eventId=projectStage(id)||thread.eventId;}}return entry;};
const orgBeforeProjectStory=updateOrganisation;
updateOrganisation=function(key,e,effects){const notes=orgBeforeProjectStory(key,e,effects);const id=effects.projectId||state.pending?.projectId;if(id&&effects.projectDemand){const p=state.projects.find(p=>p.id===id),line=state.productLines.find(p=>p.id===id);if(p)p.plannedAnnualRevenue=rtMoney(clamp(p.plannedAnnualRevenue*effects.projectDemand,5,300));if(line)line.annualPotential=rtMoney(clamp(line.annualPotential*effects.projectDemand,5,300));notes.push(`${projectRef(id)?.name||id}：${line?'量產訂單營收基礎':'未來量產營收潛力'} ×${effects.projectDemand}；尚未量產不會提前產生出貨營收。`);}return notes;};
const pendingBeforeProjectStory=pendingEvent;
pendingEvent=function(){const e=pendingBeforeProjectStory();if(!e)return e;const p=projectRef(state.pending.projectId||state.pending.thread?.projectId);return p&&e.kind==='client'?{...e,title:`${p.name}｜${e.title}`} :e;};
function projectContext(){const p=projectRef(state.pending?.projectId||state.pending?.thread?.projectId);if(!p)return '';const c=state.clients.find(c=>c.id===p.clientId),active=state.projects.some(x=>x.id===p.id),line=state.productLines.some(x=>x.id===p.id);return `<section class="actor-box project-context"><b>關聯專案 ${esc(p.id)} · ${esc(p.name)}</b><span>客戶：${esc(c?.name||'待定')} · ${line?'已量產':p.outcome==='failed'?'失敗結案':esc(p.status)}${active?' · '+fmt(p.progress)+'%':''}</span><p class="hint">本次進度與產品訂單效果作用於此案，客戶關係作用於 ${esc(c?.name||'對應客戶')}。</p></section>`;}
function projectStoryPanel(){const ids=[...state.projects.map(p=>p.id),...state.productLines.slice(-5).map(p=>p.id),...state.projectArchive.filter(p=>p.outcome==='failed').slice(0,3).map(p=>p.id)];return `<details class="org-card"><summary>專案與客戶劇情紀錄</summary>${[...new Set(ids)].map(id=>{const p=projectRef(id),c=state.clients.find(c=>c.id===p?.clientId),log=state.projectStories[id]||[];return `<article class="project-item"><b>${esc(p?.name||id)} · ${esc(id)}</b><p>${esc(c?.name||'客戶待定')} · ${state.productLines.some(x=>x.id===id)?'量產接單':p?.outcome==='failed'?'失敗結案':esc(p?.status||'')}</p>${log.slice(0,4).map(x=>`<p class="hint">${x.date} · ${esc(x.text)}</p>`).join('')||'<p class="hint">等待專案里程碑。</p>'}</article>`;}).join('')}</details>`;}
const managementBeforeProjectStory=managementMain;
managementMain=function(){return managementBeforeProjectStory()+projectStoryPanel();};
const effectBeforeProjectStory=effectSummary;
effectSummary=function(e){return effectBeforeProjectStory(e)+(e.projectDemand?`、本案量產營收潛力 ×${e.projectDemand}`:'');};
const eligibilityBeforeProjectStory=eventAllowed;
eventAllowed=function(e){if(!eligibilityBeforeProjectStory(e))return false;if(['recall','cancel','hit','pricewar','longsupport','receivable','exclusive','award','distributor','export'].includes(e.id)&&!state.productLines.length)return false;if(e.id==='designwin'&&!state.projects.some(p=>p.progress>=90))return false;if(['fae','ae-reference'].includes(e.id)&&!state.projects.some(p=>p.progress>=50))return false;return true;};
const decisionEffectsBeforeProjectStory=addDecisionEffects;
addDecisionEffects=function(e,effects){const id=effects.projectId||state.pending?.projectId;if(id&&state.pending?.actor?.type==='client'&&effects.revenueFactor){const reduced={...effects};delete reduced.revenueFactor;decisionEffectsBeforeProjectStory(e,reduced);const p=state.projects.find(p=>p.id===id);if(p)p.plannedAnnualRevenue=clamp(p.plannedAnnualRevenue*effects.revenueFactor,5,300);else if(state.productLines.some(p=>p.id===id))state.operationalEffects.push({name:e.title,projectId:id,revenueFactor:effects.revenueFactor,until:state.elapsedDays+90});return;}decisionEffectsBeforeProjectStory(e,effects);};
const contextBeforeProjectStory=operationContext;
operationContext=function(){const all=state.operationalEffects;state.operationalEffects=all.filter(x=>!x.projectId);try{return contextBeforeProjectStory();}finally{state.operationalEffects=all;}};
const salesBeforeProjectStory=calculateProductRevenue;
calculateProductRevenue=function(days,context,record=true){const r=salesBeforeProjectStory(days,context,record);for(const line of r.lines){const factor=state.operationalEffects.filter(x=>x.projectId===line.id&&x.until>state.elapsedDays).reduce((n,x)=>n*(x.revenueFactor||1),1),old=line.revenue;line.revenue=rtMoney(old*factor);r.production+=line.revenue-old;if(record){const p=state.productLines.find(p=>p.id===line.id);if(p)p.lastRevenue=line.revenue;}}r.total=r.production+r.samples+r.services;return r;};


const resumeBeforeProjectStory=graphInit;
graphInit=function(){resumeBeforeProjectStory();if(state.pending&&!state.pending.projectId){const actor=state.pending.actor,id=state.pending.thread?.projectId||((actor?.type==='client')?[...state.projects,...state.productLines].find(p=>p.clientId===actor.id)?.id:null);if(id&&projectRef(id))state.pending.projectId=id;}};

// Decision windows are sparse; routine milestones report themselves without pausing.
const auditGraphBefore=graphInit;
graphInit=function(){auditGraphBefore();state.nextChoiceAllowedAt??=state.elapsedDays+(state.pending?0:30);if(state.eventPacingVersion!==2){state.eventPacingVersion=2;state.nextEventAt=Math.max(state.nextEventAt||0,state.elapsedDays+60);state.storyQueue.forEach(t=>t.due=Math.max(t.due,state.elapsedDays+30));}};
function routineProjectNews(p,id){const names={'pj-spec':'客戶規格交流已排入日程','pj-design':'電路與版圖設計持續推進','pj-sample':'工程樣品已送交客戶測試'},text=names[id]||'專案持續進行';projectStory(p.id,text+'，日常進度照常累積。');state.realtimeNotes.unshift({year:state.year,month:state.month,day:state.day,text:p.name+'：'+text});state.lastAmbientEvents=[{year:state.year,month:state.month,day:state.day,title:p.name+' · 專案消息',text:`${state.clients.find(c=>c.id===p.clientId)?.name||'客戶'}：${text}。無額外一次性支出，尚未量產不計出貨收入。`},...(state.lastAmbientEvents||[])].slice(0,6);}
scheduleProjectStories=function(){for(const p of state.projects){const id=projectStage(p.id),key=p.id+'|'+id;if(state.projectMilestones[key])continue;state.projectMilestones[key]=true;if(['pj-spec','pj-design','pj-sample'].includes(id))routineProjectNews(p,id);else queueProjectStage(p,id,30+Math.floor(random()*45),'重要客戶驗證節點');}for(const p of state.productLines){const key=p.id+'|pj-order';if(state.projectMilestones[key])continue;state.projectMilestones[key]=true;queueProjectStage(p,'pj-order',30+Math.floor(random()*45),'量產後接單');projectStory(p.id,'通過量產驗證，開始出貨；例行交付自動進行，重大訂單再提請決策。');}};
const auditSimulationBefore=simulateYear;
simulateYear=function(...args){state.nextChoiceAllowedAt=state.elapsedDays+45+Math.floor(random()*46);return auditSimulationBefore(...args);};
const auditRecordBefore=recordDecisionStory;
recordDecisionStory=function(...args){const entry=auditRecordBefore(...args);if(entry.success&&entry.threadId&&random()<.55){state.storyQueue=state.storyQueue.filter(t=>t.id!==entry.threadId);entry.threadId=null;entry.text=entry.text.replace(/。\d+ 天後開始可能出現相關後續（於下一個決策節點處理）/,'。後續交由部門例行追蹤');}return entry;};
const auditEligibilityBefore=eventAllowed;
eventAllowed=function(e){if(!auditEligibilityBefore(e))return false;if(['rush','obsolete','niche','warranty','client-bid'].includes(e.id)&&!state.productLines.length)return false;return true;};
// Remove a particular product, preserving the identities of the others.
reconcileProductLines=function(){const target=Math.max(0,Math.floor(state.products));while(state.productLines.length>target){const id=state.pending?.projectId||state.pending?.thread?.projectId,index=state.productLines.findIndex(p=>p.id===id);state.productLines.splice(index>=0?index:state.productLines.length-1,1);}state.products=state.productLines.length;};
const auditAddEffectsBefore=addDecisionEffects;
addDecisionEffects=function(e,effects){if(effects.progressTarget==='other'){const id=effects.projectId||state.pending?.projectId,p=state.projects.find(p=>p.id!==id);effects.progressProjectId=p?.id||'NO_OTHER_PROJECT';}return auditAddEffectsBefore(e,effects);};
// Specialist responsibilities and plain-language promises match their actual effects.
const specialistMap={'client-delay':'fae','supplier-engineer':'quality','supplier-switch':'quality','supplierquality':'quality','hire-ae':'ae','hire-fae':'fae','poach':'hr','designwin':'product','obsolete':'product','newcompetitor':'product','legal-nda':'legal','finance-credit':'admin'};
for(const e of businessEvents){if(specialistMap[e.id])e.dept=specialistMap[e.id];if(e.id==='supplier-engineer')for(const o of e.options)if(o.effect.hireOps){o.effect.hireQuality=o.effect.hireOps;delete o.effect.hireOps;}if(e.id==='supplier-switch')for(const o of e.options)if(o.risk?.chance==='ops')o.risk.chance='quality';if(e.id==='receivable'){e.text='客戶希望將接下來一段時間的部分貨款延後 30 天支付，現金流會承壓。';e.options[1].hint='未來 90 天的 30% 營收延後 30 天收款；不會立即成為現金';}if(e.id==='longsupport')e.title='老客戶要求四年供貨承諾';if(e.id==='client-suspend')e.options[0].effect.progressTarget='other';}
const auditSummaryBefore=effectSummary;
effectSummary=function(e){let text=auditSummaryBefore(e).replace(/本期營收/g,'未來 90 天營收基礎').replace(/本期款項遞延 /g,'未來 90 天收款延後 30 天：');if(e.progressTarget==='other')text+='；進度效果移至另一進行中專案';return text;};
// Already-open choices keep their identities; do not reintroduce generic filler choices.
const auditResumeBefore=graphInit;
graphInit=function(){auditResumeBefore();if(state.pending&&state.choiceAuditVersion!==2){const e=businessEvents.find(e=>e.id===state.pending.eventId);if(e){state.pending.options=drawAlternatives(e);state.optionRulesVersion=7;}state.choiceAuditVersion=2;}};


const auditCleanGraphBefore=graphInit;
graphInit=function(){auditCleanGraphBefore();state.storyQueue=state.storyQueue.filter(t=>{const stage=t.lifecycle?projectStage(t.projectId):t.eventId;if(t.lifecycle&&['pj-spec','pj-design','pj-sample'].includes(stage)){const p=projectRef(t.projectId);if(p){const key=p.id+'|'+stage;if(!state.projectMilestones[key]){state.projectMilestones[key]=true;routineProjectNews(p,stage);}}return false;}return true;});};
const auditScopeSummaryBefore=effectSummary;
effectSummary=function(e){let text=auditScopeSummaryBefore(e);const id=e.projectId||state.pending?.projectId||state.pending?.thread?.projectId;if(e.revenueFactor&&state.pending?.actor?.type==='client'&&state.projects.some(p=>p.id===id))text=text.replace('未來 90 天營收基礎','本案未來量產營收潛力');return text;};

document.addEventListener('pointerdown',()=>{rtPointerHeld=true;});
document.addEventListener('pointerup',()=>{rtPointerHeld=false;});
document.addEventListener('pointercancel',()=>{rtPointerHeld=false;});
document.addEventListener('change',e=>{if(e.target.id==='strategy')changeStrategy(e.target.value);if(e.target.id==='clockSpeed')changeClockSpeed(e.target.value);});
document.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='startForm'){const name=validName($('companyName').value);if(!name){$('nameError').textContent='請輸入公司名稱。';return;}create(name,$('startYear').value);}if(e.target.id==='renameForm'){const name=validName($('newName').value);if(!name)return;state.name=name;save();$('dialog').close();render();}});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.hasAttribute('data-talent-open'))talentDialog();if(b.dataset.talentAction)submitTalent(b.dataset.talentAction);if(b.hasAttribute('data-clock-toggle'))toggleClock();if(b.dataset.strategy)changeStrategy(b.dataset.strategy);if(b.dataset.boardAction)resolveBoard(b.dataset.boardAction);if(b.hasAttribute('data-confirm-retire')){if(retire())$('dialog').close();}if(b.dataset.eventChoice!==undefined)chooseEvent(Number(b.dataset.eventChoice),b.dataset.eventToken);if(b.hasAttribute('data-defer-event'))deferEvent(b.dataset.eventToken);if(b.dataset.rescue)resolveCrisis(b.dataset.rescue);if(b.dataset.focus)runYear(b.dataset.focus);if(b.hasAttribute('data-auto'))runYear(autoFocus(),true);if(b.hasAttribute('data-next'))nextYear();if(b.hasAttribute('data-begin')&&state.stage==='profile'){prepareAnnualEvent();}if(b.hasAttribute('data-reroll'))create(state.name,state.startYear);if(b.hasAttribute('data-new')){state=null;localStorage.removeItem(KEY);render();window.scrollTo({top:0,behavior:'smooth'});}if(b.hasAttribute('data-close'))$('dialog').close();if(b.hasAttribute('data-confirm-new')){state=null;localStorage.removeItem(KEY);$('dialog').close();render();}});

$('help').onclick=()=>modal('<h2>一間公司，也有無法選擇的出身。</h2><p>你決定公司名稱與成立年份；系統隨機抽取創辦人背景、起步資金、產品方向、地點與供應鏈條件。</p><p>重大決策通常間隔 60～150 天；劇情後續也至少間隔 45 天。規格交流、例行設計與送樣等消息自動記錄，不需選擇。時間可選每 4 秒 1 天至每秒 90 天，共 11 種速度；需要選擇時時間自動暫停，選擇後繼續。營運期間每隔隨機天數會出現無法選擇的自發事件。員工、客戶、供應商與專案都可能受影響；事件會保留於紀錄。薪資、營收、利息及日常研發進度按實際天數計算，選項列出的代價則為當次一次性影響。本階段策略可以隨時在事件上方調整，改策略不會重抽事件。真實年代新聞與公司事件會同時影響營收。爆單可能帶來成長，砍單、召回與壞帳也會讓公司虧損。也可選「交給命運」由系統依公司狀況自動決策。</p><p>沒有固定公司經營年限；老闆起始年齡隨機為 40～55 歲，年滿 70 歲自動退休。最後一次時間推進會停在退休日。你可以在年度決策或報告畫面按「退休交棒」。上市成功後也能繼續經營；接受收購、被董事會撤換或公司倒閉才會結束。2026 年起是虛構未來推演。畫面右側顯示四家同年成立的模擬公司。它們也會受到景氣與早期風險影響，可能比你更早退場。</p><p>資金低於 19 百萬元會觸發週轉危機，每輪有兩次自救機會。銀行借款、股權募資、縮編或出售產品各有代價；負現金且自救失敗會倒閉。借款每年利息 8%、償還當時本金的 15%。營收拆成量產出貨、工程樣品、設計服務。未量產沒有量產出貨收入；新產品需爬坡，停售期間停止出貨。專案連續兩次驗證失敗或三次重大技術延誤會結案，已投入費用不重複扣除，另付結案費並影響訂單。AE 負責內部參考設計與應用驗證，FAE 負責客戶現場與導入。新局起始 36～50 位員工，另備研發週轉金，初始現金至少支應約兩年固定薪資、營運與產品策略（不含事件及製造成本）；舊存檔保留既有人數，可透過整批招募擴編。老闆自己的回扣與桃色爭議會累積風險，曝光後降低聲譽與董事信任，增加派系壓力，間接引發內鬥或被迫下台。個人所得與公司現金分開。部門擴充為 14 個職能，原有人數會重新分配而非重複增加；人資會隨時間改善低迷士氣；版圖、驗證、品質等缺口會拖慢量產，法務財務與人資影響決策機率與後續風險。每個事件選項都顯示負責部門、固定影響與執行受阻的代價；決策會留下 14～180 天後進入處理窗口的後續事件，沿用同一合作方。部門員工人數會影響薪資、提案、製程協作及三條專案的進度；專案通過驗證就會量產並補上新案。供應商與客戶的信任、產能及商機會影響營收。公司也可能團隊離散，也可能成為技術冠軍、被策略併購或公開上市。專業經理人評分依財務、決策交付、治理、人才與市場計算，結局會顯示分數、等級與依據。所有進度只儲存在目前瀏覽器；背景或關閉頁面後不追算時間。</p><button class="primary" data-close>回到公司</button>');
