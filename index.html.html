function applyBossEffects(effects,e){state.bossScandalRisk=clamp(state.bossScandalRisk+(effects.bossRisk||0),0,100);state.bossReputation=clamp(state.bossReputation+(effects.bossRep||0),0,100);state.factionPressure=clamp(state.factionPressure+(effects.faction||0),0,100);state.personalWealth=Math.max(0,state.personalWealth+(effects.personal||0));if(effects.exposed)state.bossExposed=true;if(effects.clearExposure)state.bossExposed=false;if(e.kind==='boss'){state.scandalLog.unshift({year:state.year,month:state.month,day:state.day,title:e.title,risk:state.bossScandalRisk,pressure:state.factionPressure});state.scandalLog=state.scandalLog.slice(0,12);}}
function exposeBoss(reason){state.bossExposed=true;state.bossReputation=clamp(state.bossReputation-12,0,100);state.factionPressure=clamp(state.factionPressure+16,0,100);state.board=clamp(state.board-8,0,100);state.team=clamp(state.team-4,0,100);return `${reason}；老闆聲譽 −12、派系壓力 +16、董事支持 −8、團隊 −4。`;}
function updateBossPolitics(dt){const notes=[];if(!state.bossExposed&&state.bossScandalRisk>=25&&random()<1-Math.pow(1-clamp(.12+state.bossScandalRisk*.006,.12,.8),dt)){notes.push(exposeBoss('老闆過往的利益往來被揭露，反對派開始串聯'));}const pressure=(state.bossExposed?8:0)+Math.max(0,50-state.bossReputation)*.12+state.bossScandalRisk*.06+Math.max(0,40-staffScore('legal'))*.08;state.factionPressure=clamp(Math.round((state.factionPressure+(pressure-2)*dt)*10)/10,0,100);if(state.bossExposed){state.board=clamp(Math.round((state.board-5*dt)*10)/10,0,100);notes.push(`老闆爭議持續發酵：派系壓力 ${fmt(state.factionPressure)} / 100，董事持續觀望。`);}return notes;}

const storyAxes={reliability:'技術可靠度',growth:'市場擴張',people:'組織信任',governance:'治理透明'};
function riskDepartment(e,o){if(e.dept)return e.dept;if(e.kind==='boss'||e.kind==='conduct')return 'legal';const c=eventCategory(e);if(c==='people')return 'hr';if(c==='governance'||e.id==='patent')return 'legal';if(c==='finance')return 'admin';if(['cyber','cybervendor'].includes(e.id))return 'it';if(e.id==='automation')return 'verification';if(c==='quality')return 'quality';if(c==='supplier')return 'ops';if(c==='engineering')return 'rd';return /驗證|支援|規格|應用/.test(o.label)?'fae':'sales';}
function riskFailure(e,dept){if(e.kind==='boss')return {bossRep:-5,bossRisk:8,faction:6};if(dept==='hr')return {team:-3,cash:-2};if(dept==='legal')return {board:-5,conductRisk:5,cash:-2};if(dept==='admin')return {cash:-4,board:-2};if(dept==='it')return {progress:-6,cash:-3};if(['rd','layout','verification','product','quality'].includes(dept))return {progress:-5,tech:-1,cash:-2};if(dept==='ops')return {supplierRel:-4,revenueFactor:.93};return {clientRel:-4,market:-3,revenueFactor:.93};}
function withDecisionRisk(e,original){const o=structuredClone(original);if(o.risk?.rulesVersion===4)return o;const dept=riskDepartment(e,o);if(o.effect.exit==='retired'){o.risk={chance:1,deterministic:true,dept,good:{},bad:{},win:'你正式交出經營權；退休後不能恢復本次任期。',lose:'',rulesVersion:4};return o;}if(o.effect.exit==='acquired'){delete o.effect.exit;o.risk={chance:.82,dept:'legal',good:{exit:'acquired'},bad:{cash:-3,board:-5},win:'盡職調查與交割通過，你正式交出公司經營權。',lose:'交割條件未談攏，收購未完成，顧問費與董事疑慮留下來。',rulesVersion:4};return o;}
if(o.risk){o.risk={...o.risk,dept,rulesVersion:4};return o;}o.risk={chance:.79,dept,good:{},bad:riskFailure(e,dept),win:`${departments[dept].name}完成「${o.label}」，但後續仍須追蹤。`,lose:`${departments[dept].name}執行「${o.label}」遇到阻礙，追加代價與後續壓力。`,rulesVersion:4};return o;}
function effectSummary(effect){const labels={cash:'公司現金',tech:'技術',team:'團隊',market:'市場',progress:'專案進度',products:'量產產品',board:'董事支持',supplierRel:'上游信任',supplierCapacity:'供貨產能',clientRel:'客戶信任',clientOrders:'客戶商機',conductRisk:'公司爭議風險',bossRisk:'老闆風險',bossRep:'老闆聲譽',faction:'派系壓力',personal:'個人資產',equity:'持股百分點'};const a=[];for(const [k,v]of Object.entries(effect||{})){if(!v)continue;if(labels[k])a.push(labels[k]+' '+(k==='personal'&&v<-999?'歸零':signed(v)));else if(k.startsWith('hire')){const map={hireRd:'rd',hireLayout:'layout',hireVerification:'verification',hireProduct:'product',hireFae:'fae',hireSales:'sales',hireMarketing:'marketing',hireOps:'ops',hireQuality:'quality',hireAdmin:'admin',hireHr:'hr',hireLegal:'legal',hireIt:'it'};if(map[k])a.push(departments[map[k]].name+' '+signed(v)+' 人（後續薪資改變）');}else if(k==='revenueFactor')a.push('本期營收 ×'+v);else if(k==='marginShift')a.push('毛利率 '+signed(Math.round(v*100))+' 百分點');else if(k==='defer')a.push('本期款項遞延 '+Math.round(v*100)+'%');else if(k==='contractYears')a.push('合約 '+v+' 年');else if(k==='contractFactor')a.push('合約期營收 ×'+v);else if(k==='listed')a.push('完成上市');else if(k==='exposed')a.push('老闆爭議公開');else if(k==='clearExposure')a.push('結束本輪公開爭議');else if(k==='exit')a.push(v==='acquired'?'完成收購並結束任期':'正式退休並結束任期');}return a.join('、')||'無額外數值變動';}
function riskDescription(o){const r=o.risk;if(!r)return esc(o.hint);return `${esc(departments[r.dept]?.name||'主管協調')}負責 · ${r.deterministic?'確定交棒':`執行順利率 ${Math.round(eventChance(r)*100)}%`}<br>固定影響：${esc(effectSummary(o.effect))}<br>順利時：${esc(effectSummary(r.good))}<br>${r.deterministic?'代價：本次經營人生結束':`受阻時：${esc(effectSummary(r.bad))}`}<br>後續：${r.deterministic?'本次任期結束，不再進入新的經營事件':`影響${esc(storyAxes[storyAxis(r.dept)])}，並留下延後事件`}。`;}
function storyAxis(dept){return ['rd','layout','verification','quality','it','ops'].includes(dept)?'reliability':['sales','marketing','fae','product'].includes(dept)?'growth':dept==='hr'?'people':'governance';}
function chooseStoryEvent(pool){const weighted=[];for(const e of pool){let weight=1;const axis=storyAxis(riskDepartment(e,{label:''})),v=state.storyState[axis];if(v<-15)weight+=2;if(v>20&&['hit','award','designwin','niche','listing','campus-hire'].includes(e.id))weight+=2;for(let i=0;i<weight;i++)weighted.push(e);}return pick(weighted);}
function takeDueThread(){state.storyQueue.sort((a,b)=>a.due-b.due);const i=state.storyQueue.findIndex(t=>t.due<=state.elapsedDays&&businessEvents.some(e=>e.id===t.eventId));return i<0?null:state.storyQueue.splice(i,1)[0];}
function recordDecisionStory(e,o,success,effects){const dept=o.risk?.dept||riskDepartment(e,o),axis=storyAxis(dept),change=effects.bossRisk>0?-8:success?3:-5;state.storyState[axis]=clamp(state.storyState[axis]+change,-100,100);if((effects.team||0)<-5)state.storyState.people=clamp(state.storyState.people-2,-100,100);if(effects.clearExposure)state.storyState.governance=clamp(state.storyState.governance+4,-100,100);const depth=state.pending.thread?.depth||0;let thread=null;if(!effects.exit&&depth<2){const id=e.kind==='boss'?(effects.bossRisk>0||!success?'after-owner-leak':'after-governance'):dept==='hr'?(success?'after-team':'after-attrition'):['legal','admin'].includes(dept)?(success?'after-governance':'after-finance'):['sales','marketing','fae','product'].includes(dept)?(success?'after-client-growth':'after-client-claim'):dept==='it'?'after-security':success?'after-validation':'after-rework';const delay=14+Math.floor(random()*167),due=state.elapsedDays+(state.pending.days||1)+delay;thread={id:++state.storySerial,eventId:id,sourceTitle:e.title,choice:o.label,success,actor:structuredClone(state.pending.actor),dept,due,depth:depth+1};state.storyQueue.push(thread);state.storyQueue=state.storyQueue.slice(-10);}const text=`${departments[dept].name}${success?'執行順利':'執行受阻'}；${storyAxes[axis]} ${signed(change)}${thread?`。${Math.ceil(thread.due-state.elapsedDays-(state.pending.days||1))} 天後開始可能出現相關後續（於下一個決策節點處理）`:'。本次任期或事件鏈告一段落'}`;const entry={year:state.year,month:state.month,day:state.day,title:e.title,choice:o.label,success,axis,change,text,threadId:thread?.id};state.storyJournal.unshift(entry);state.storyJournal=state.storyJournal.slice(0,60);return entry;}
function storyPanel(){if(!state.storyJournal.length)return '';return `<details class="org-card" style="margin-bottom:18px" open><summary><span>決策留下的故事</span><b>${state.storyQueue.length} 條待續事件</b></summary><div class="dept-grid">${Object.entries(storyAxes).map(([k,n])=>`<div><span>${n}</span><b>${signed(state.storyState[k])}</b></div>`).join('')}</div><p class="hint">${esc(state.storyJournal[0].text)}</p>${state.storyQueue.slice(0,4).map(t=>`<p class="hint">「${esc(t.sourceTitle)}」尚有後續 · ${t.due<=state.elapsedDays?'已進入處理窗口':`約 ${Math.ceil(t.due-state.elapsedDays)} 天後進入處理窗口`}</p>`).join('')}</details>`;}

function scene(){return '<div class="scene" aria-label="IC 設計公司辦公室插畫" role="img"><div class="window"></div><div class="desk"></div><div class="monitor"></div><div class="character"></div><div class="leaves"></div><div class="plant"></div><span class="scene-note">LIFE IN YOUR COMPANY</span></div>';}
function stats(){return `<div class="stats four"><div class="stat"><label>◈ 公司資金</label><b>${fmt(state.cash)}</b><small>百萬元</small></div><div class="stat"><label>▦ 技術實力</label><b>${state.tech}</b><small>/ 100</small></div><div class="stat"><label>♡ 團隊狀態</label><b>${state.team}</b><small>/ 100</small></div><div class="stat"><label>↗ 市場地位</label><b>${state.market}</b><small>/ 100</small></div></div>`;}
function profileCard(){const p=state.profile;return `<div class="paper profile"><div class="eyebrow">YOUR COMPANY WAS BORN</div>${scene()}<h2>${esc(state.name)}，成立了。</h2><p class="story">你無法完全選擇創業時拿到的牌。這一次，公司從 ${p.region} 開始。你會經營多久，取決於公司走向，以及何時決定交棒。</p><div class="birth-grid"><div><small>老闆年齡與交棒 · 起始 ${totalStaff()} 位員工</small><b>${bossAge()} 歲創業 · ${state.retirementAge} 歲退休</b><p>年齡隨日曆推進，到 ${retirementDate()} 自動退休。可隨時提前交棒。</p></div><div><small>創辦人背景</small><b>${p.founder.name}</b><p>${p.founder.desc}</p></div><div><small>起步資金</small><b>${p.capital.name}</b><p>${p.capital.desc} 本局另備擴編週轉金 ${state.expansionReserve||0} 百萬元，已計入公司資金。</p></div><div><small>第一個方向</small><b>${p.product.name}</b><p>${p.product.fit}</p></div><div><small>供應鏈條件</small><b>${p.chain.name}</b><p>${p.chain.desc}</p></div></div><button class="primary" data-begin>接受這個起點，開始經營 →</button><button class="text-btn" data-reroll>重新抽一次起點</button></div>`;}
function peers(){return `<div class="cohort"><div class="cohort-head"><b>同年成立的公司</b><span>${state.peers.filter(p=>p.alive).length+(state.alive?1:0)} / 5 仍在營運</span></div><div class="peer you"><span>▦</span><b>${esc(state.name)}</b><small>${state.alive?'營運中':'旅程結束'}</small></div>${state.peers.map(p=>`<div class="peer ${p.alive?'':'gone'}"><span>◇</span><b>${p.name}</b><small>${p.status}</small></div>`).join('')}</div>`;}
function timeline(){return `<details class="timeline"><summary>查看公司事件紀錄 · ${state.history.length} 次決策</summary>${state.history.map(h=>`<div class="entry"><small>${h.year} 年 ${h.month||1} 月 ${h.day||1} 日 · ${h.days||Math.round((h.months||12)*30.4375)} 天 · ${esc(h.focusName)}</small><b>${esc(h.world?.title||h.generic?.title||'日常營運')}</b><p>${esc(h.focusText)} 本期營運收支 ${h.operation>=0?'+':''}${h.operation} 百萬元。${h.headcount!=null?` 員工 ${h.headcount} 人。`:''}</p>${h.storyOutcome?`<p>〔決策後續〕${esc(h.storyOutcome.text)}</p>`:''}${(h.ambientEvents||[]).map(n=>`<p>〔自發事件〕${esc(n.title)}：${esc(n.text)}</p>`).join('')}${(h.projectNotes||[]).map(n=>`<p>${esc(n)}</p>`).join('')}</div>`).join('')||'<p class="hint">公司第一年的故事還沒寫下。</p>'}</details>`;}
function changes(d){const labels={cash:'資金',tech:'技術',team:'團隊',market:'市場',products:'量產產品',board:'董事支持'};return `<div class="deltas">${Object.entries(d).filter(([k,v])=>k!=='progress'&&v).map(([k,v])=>`<span class="delta ${v<0?'bad':''}">${labels[k]} ${v>0?'+':''}${v}</span>`).join('')}</div>`;}
function turnCard(){const w=world[state.year];return `<div class="sim-grid"><div><div class="paper event">${scene()}<div class="event-meta"><span>公司第 ${state.age+1} 年</span><span>${state.year} 年</span></div>${w?`<div class="world-badge">◎ 真實時代背景</div><h2>${w.title}</h2><p class="story">${w.text}</p><a class="source" href="${w.url}" target="_blank" rel="noopener">事件資料：${w.source} ↗</a>`:`<h2>${state.year} 年，你要把力氣放在哪裡？</h2><p class="story">市場仍在變化。資源有限，你只能選擇一項年度經營重心。</p>`}<h3 class="choose-title">選擇今年的經營重心</h3><div class="focuses">${Object.entries(focuses).map(([k,f])=>`<button class="focus" data-focus="${k}" ${''}><span>${f.icon}</span><b>${f.name}</b><small>${state.cash<f.cost?'資金不足 · 點選處理週轉危機':f.desc}</small></button>`).join('')}</div><button class="fate" data-auto>✦ 交給命運替我決定這一年</button></div>${timeline()}</div><aside class="right-rail">${peers()}${revenuePanel()}${governancePanel()}<div class="paper mini"><small>研發中的下一顆 IC</small><b>${state.progress}%</b><div class="progress"><i style="width:${clamp(state.progress,0,100)}%"></i></div><p>${state.products} 款產品量產中。技術與團隊會影響產品成功率。</p></div></aside></div>`;}
function resultCard(){const r=state.result,e=r.world||r.generic;return `<div class="sim-grid"><div><div class="paper event"><div class="result-label">${r.year} 年度報告</div><h2>${r.auto?'命運替你選擇：':''}${r.focusName}</h2><p class="story">${r.focusText}</p>${e?`<div class="year-event"><small>${r.world?'真實世界事件':'這一年發生的事'}</small><b>${e.title}</b><p>${e.text}</p>${r.world?`<a class="source" href="${e.url}" target="_blank" rel="noopener">事件資料：${e.source} ↗</a>`:''}</div>`:''}${r.world&&r.generic?`<div class="year-event"><small>公司隨機事件 · ${esc(r.eventChoice||'')}</small><b>${esc(r.generic.title)}</b><p>${esc(r.generic.text)}</p></div>`:''}${annualFinancials(r)}${changes(r.delta)}${r.financing?.length?`<div class="rescue-log">${r.financing.map(x=>`<p>${esc(x)}</p>`).join('')}</div>`:''}<div class="settlement">年度營業損益 ${signed(r.operation)}；還本金、收款與遞延後的營運現金流 ${signed(r.cashFlow??r.operation)} 百萬元。上方資金變化另含策略、事件及危機籌資。</div><button class="primary" data-next>前往 ${state.year+1} 年 →</button></div>${timeline()}</div><aside class="right-rail">${peers()}${revenuePanel()}${governancePanel()}</aside></div>`;}
function ending(){const types={
ageRetired:['屆齡退休','到了把公司交棒的年紀。','你達到開局設定的退休年齡，完成本次老闆人生。公司由接班人繼續經營。'],
retired:['主動退休','這一次，你決定把時間留給自己。','公司仍在運作，你選擇交棒，結束自己的經營任期。'],
acquired:['策略收購','你簽下收購協議，故事換了一位主角。','產品與團隊加入新的公司，你不再握有經營權。'],
ousted:['被迫下台','董事會通過了更換負責人的決議。','公司沒有倒閉，但你失去經營權。創辦公司的名字，仍然留在那面牆上。'],
team:['團隊離散','辦公室慢慢安靜下來。','關鍵人員離開，已經無法維持交付與研發。'],
closed:['主動停業','你選擇在這裡停止營業。','清理債務與剩餘資產，也是創業者必須面對的決定。'],
bankrupt:['公司倒閉','公司已經無法支付到期款項。','自救沒有成功，公司停止營運。下一次創業，你會記得這段經驗。']};
const [badge,title,desc]=types[state.endType]||(!state.alive?types.bankrupt:types.retired);
return `<div class="sim-grid"><div><div class="paper ending"><div class="eyebrow">YOUR FOUNDER STORY</div><div class="big">▦</div><span class="award">${badge}</span><h2>${title}</h2><p>${esc(state.name)} · ${state.startYear}–${state.year} · 經營 ${Math.floor(state.elapsedDays/365.25)} 年 ${Math.floor(state.elapsedDays%365.25)} 天</p><p>${esc(state.failureReason||desc)}</p><p class="hint">老闆 ${bossAge()} 歲 · 公司${state.alive?'仍在營運':'已停止營運'} · ${state.listed?'曾完成上市':'獨立經營歷程'}</p>${state.result?`<div class="year-event" style="text-align:left"><small>最近一期 · ${state.result.year} 年 ${state.result.month||1} 月</small><b>${esc(state.result.generic?.title||'年度營運')}</b><p>${esc(state.result.generic?.text||state.result.focusText)}</p></div>${annualFinancials(state.result)}`:''}${state.crisis?.messages.length?`<div class="rescue-log" style="text-align:left">${state.crisis.messages.map(m=>`<p>${esc(m)}</p>`).join('')}</div>`:''}<p class="hint">未償借款 ${fmt(state.debt)} · 創辦人持股 ${state.equity}%</p><div class="ending-stats"><span>資金 <b>${fmt(state.cash)}</b></span><span>技術 <b>${state.tech}</b></span><span>團隊 <b>${state.team}</b></span><span>產品 <b>${state.products}</b></span></div><button class="primary" data-new>再成立一家公司 →</button></div>${timeline()}</div><aside class="right-rail">${peers()}${governancePanel()}</aside></div>`;}
function startScreen(){const yearOptions=Array.from({length:22},(_,i)=>2000+i).map(y=>`<option value="${y}" ${y===2020?'selected':''}>${y} 年${world[y]?` · ${world[y].title}`:''}</option>`).join('');return `<section class="intro"><div class="eyebrow">ONE COMPANY AMONG THOUSANDS</div><h1>如果你在另一個年代<br>創立一家 IC 公司。</h1><p>你可以選擇名字與時代。老闆起始年齡隨機為 25～55 歲，70 歲退休。<br>創辦人、資金、產品方向與運氣，由世界決定。</p></section><div class="paper start">${scene()}<form id="startForm"><label for="companyName">公司名稱</label><input class="input" id="companyName" maxlength="24" placeholder="例如：芯程半導體" required><label for="startYear" style="margin-top:18px">成立年份</label><select class="input" id="startYear">${yearOptions}</select><div class="random-field"><span>∞</span><div><b>沒有固定任期</b><small>持續經營，直到倒閉、主動或屆齡退休、被迫下台或接受收購。2026 年起使用虛構未來事件推演。</small></div></div><p class="hint">年代事件依公開資料整理；遊戲中的財務與機率為簡化模擬。</p><p class="hint error" id="nameError"></p><button class="primary" type="submit">抽取公司的起點 →</button></form></div>`;}
function render(){const running=!!state;$('rename').hidden=!running;$('restart').hidden=!running;$('retire').hidden=!running||!['turn','event','result'].includes(state.stage);if(!state){$('app').innerHTML=startScreen();return;}$('app').innerHTML=`<div class="companyline"><h1>${esc(state.name)}</h1><small>${state.year} 年 ${state.month} 月 ${state.day} 日 · 經營第 ${state.stage==='turn'||state.stage==='event'||state.stage==='profile'?state.age+1:Math.max(1,state.age)} 年</small></div><div class="governance-strip"><span>老闆 ${bossAge()} 歲</span><span>${state.retirementAge} 歲退休 · ${retirementDate()}</span><span>派系壓力 ${fmt(state.factionPressure)} / 100</span><span>老闆聲譽 ${fmt(state.bossReputation)} / 100</span><span>董事支持 ${state.board} / 100</span><span>創辦人持股 ${state.equity}%</span><span>${state.listed?'已上市 · 繼續經營':'獨立經營'}</span>${state.year>LAST_REAL_YEAR?'<span>虛構未來推演</span>':''}</div>${stats()}${state.stage==='profile'?'':organisationDashboard()+storyPanel()+ambientPanel()}${state.stage==='profile'?profileCard():state.stage==='turn'?turnCard():state.stage==='event'?businessCard():state.stage==='crisis'?crisisCard():state.stage==='board'?boardCard():state.stage==='result'?resultCard():ending()}`;}
function signed(n){return (n>=0?'+':'')+fmt(n);}
function annualFinancials(r){if(r.revenue==null)return '';return `<div class="financial-hero"><div><small>本期營收 · 百萬元</small><strong>${fmt(r.revenue)}</strong><span class="${(r.yoy||0)>=0?'up':'down'}">${r.yoy==null?'首期營收':`年化較前期 ${signed(r.yoy)}%`}</span></div><div><small>營業損益</small><b class="${r.operation>=0?'up':'down'}">${signed(r.operation)}</b><small>毛利率 ${r.grossMargin}%</small></div></div><div class="finance-breakdown"><span>製造成本 <b>${fmt(r.cogs)}</b></span><span>固定費用 <b>${fmt(r.overhead)}</b></span><span>借款利息 <b>${fmt(r.interest)}</b></span><span>償還本金 <b>${fmt(r.principal)}</b></span></div>${r.deferred||r.collected||r.badDebt?`<p class="hint">遞延收款 ${fmt(r.deferred)} · 收回前期款 ${fmt(r.collected)} · 前期壞帳 ${fmt(r.badDebt)}</p>`:''}`;}
function revenuePanel(){const a=[...state.history].reverse().filter(h=>h.revenue!=null).map(h=>({...h,revenue:Math.round(h.revenue*12/(h.months||12))}));const max=Math.max(1,...a.map(h=>h.revenue));const pts=a.map((h,i)=>`${10+i*160/Math.max(1,a.length-1)},${77-h.revenue/max*60}`);return `<div class="paper mini"><small>年化營收走勢 · 百萬元</small><b>${state.lastRevenue==null?'尚未結算':fmt(state.lastRevenue)}</b>${a.length?`<svg viewBox="0 0 180 90" role="img" aria-label="歷年營收趨勢" class="revenue-chart"><path d="M10 78H170" stroke="#dce3d4"/><polyline points="${pts.join(' ')}" fill="none" stroke="#497c59" stroke-width="3"/>${pts.map(p=>{const[x,y]=p.split(',');return `<circle cx="${x}" cy="${y}" r="3" fill="#497c59"/>`;}).join('')}</svg>`:''}<p>未償借款 ${fmt(state.debt)}<br>創辦人持股 ${state.equity}%</p></div>`;}
function businessCard(){const p=state.pending,e=pendingEvent(),available=state.cash-focusCost(p.key);const actor=partnerByActor(p.actor);return `${lastReport()}<div class="sim-grid"><div><div class="paper event">${strategyPicker()}${yearContext()}<div class="event-meta"><span>${actor?`${p.actor.type==='supplier'?'上游供應商':'下游客戶'} · ${esc(actor.name)}`:e.kind==='boss'?'老闆本人與經營權':e.kind==='conduct'?'內部治理與人事事件':'公司經營事件'}</span><span>${state.year} 年 ${state.month} 月 ${state.day} 日 · 本次推進 ${p.days||Math.round((p.months||1)*30.4375)} 天</span></div><div class="world-badge">✦ 公司隨機事件</div><h2>${e.title}</h2>${p.thread?`<div class="actor-box"><b>延續先前決策：${esc(p.thread.sourceTitle)}</b><span>${esc(p.thread.choice)} · ${p.thread.success?'先前執行順利':'先前執行受阻'}</span></div>`:''}<p class="story">${e.text}</p>${actor?`<div class="actor-box"><b>${esc(actor.name)}</b><span>${actor.role} · 信任 ${actor.trust}${p.actor.type==='supplier'?` · 產能指標 ${actor.capacity}`:` · 商機 ${actor.orders}`}</span></div>`:''}<div class="choices">${e.options.map((o,i)=>{const can=available>=Math.max(0,-(o.effect.cash||0));return `<button class="choice" data-event-choice="${i}" data-event-token="${p.token}" ${can?'':'disabled'}><span class="choice-letter">${String.fromCharCode(65+i)}</span><span><b>${o.label}</b><small>${can?riskDescription(o):'扣除本階段策略後，現金不足'}</small></span></button>`;}).join('')}</div><button class="fate" data-defer-event data-event-token="${p.token}">先保留現金，承擔營收 ×0.6、團隊 −8、市場 −6</button><p class="hint">策略預算 ${focusCost(p.key)} 已保留；本次可用 ${fmt(available)} 百萬元。做完選擇會結算人力、專案與營收，並自動推進 2～120 天；期間的自發事件會直接產生影響。短則數天接連出事，長則數月才遇到下一次決策。</p></div>${timeline()}</div><aside class="right-rail">${peers()}${revenuePanel()}${governancePanel()}</aside></div>`;}
function crisisCard(){const c=state.crisis,ready=state.cash>=c.needed;return `<div class="sim-grid"><div><div class="paper event crisis"><div class="world-badge">⚠ 現金流警報 · 必須處理</div><h2>${state.cash<=0?'帳戶不夠支付到期款項。':'資金快見底了，下一步怎麼辦？'}</h2><p class="story">目前現金 ${fmt(state.cash)}、未償借款 ${fmt(state.debt)} 百萬元。${c.resume==='turn'?'你選的本階段策略無法支付，先處理週轉再重新決策。':'營收不等於現金。先處理到期支出，才能決定公司是否繼續。'}</p><div class="rescue-log" role="status">${c.messages.map(m=>`<p>${esc(m)}</p>`).join('')}</div><p class="hint">本輪自救剩餘 ${Math.max(0,2-c.attempts)} 次。恢復安全資金需達 ${c.needed} 百萬元。</p><div class="choices">${[
['loan','向銀行申請週轉金',`核准後 +40；年息 8%、每年償還剩餘本金 15% · 核准率 ${Math.round(financeChance('loan')*100)}%`],
['equity','向投資人緊急募資',`成功後 +60；持股乘以 70% · 成功率 ${Math.round(financeChance('equity')*100)}%`],
['cut','出售設備並縮編','現金 +16；固定費降低，團隊 −20、技術 −7、市場 −5'],
['license','售出一款量產產品權利','現金 +28；減少一款量產產品、市場 −7']
].map(([k,t,d])=>`<button class="choice" data-rescue="${k}" ${crisisAvailable(k)?'':'disabled'}><span><b>${t}</b><small>${d}${c.used.includes(k)?' · 已嘗試':''}</small></span></button>`).join('')}</div>${ready?'<button class="primary" style="margin-top:16px" data-rescue="continue">確認資金狀況，繼續經營 →</button>':''}<button class="text-btn" data-rescue="close">停止營業，讓公司退場</button></div>${timeline()}</div><aside class="right-rail">${peers()}${revenuePanel()}</aside></div>`;}
function finish(type,reason){state.endType=type;state.failureReason=reason;state.alive=['retired','ageRetired','acquired','ousted'].includes(type);state.stage='end';save();render();}
function retire(){if(!state||!['turn','event','result'].includes(state.stage)||state.cash<=0||state.team<=0)return false;finish('retired','你主動宣布退休，把公司交給接班人。這一次，結束經營是你自己的決定。');return true;}
function governancePanel(){return `<div class="paper mini"><small>經營權與公司治理</small><b>${state.board} / 100</b><div class="progress"><i style="width:${state.board}%"></i></div><p>董事支持 ${state.board}<br>創辦人持股 ${state.equity}%<br>${state.listed?'已公開上市':'尚未上市'}<br>老闆聲譽 ${fmt(state.bossReputation)} / 100<br>老闆爭議風險 ${fmt(state.bossScandalRisk)} / 100<br>派系壓力 ${fmt(state.factionPressure)} / 100<br>個人資產 ${fmt(state.personalWealth)} 百萬元（與公司現金分開）<br>${state.bossExposed?'本人爭議公開中，持續影響董事與派系。':'本人爭議尚未公開。'}<br>董事支持低於 55 或派系壓力達 60，可能觸發撤換提案。持股不足半數增加壓力。</p>${state.contracts?.length?`<p>有效合作：${state.contracts.map(c=>`${esc(c.name)}（尚餘 ${Math.ceil(c.years*12)} 個月）`).join('、')}</p>`:''}</div>`;}
function boardOdds(){return clamp(.2+state.board*.007+state.equity*.003+state.team*.0015+(state.bossReputation-70)*.0015-state.factionPressure*.003,.12,.92);}
function boardCard(){return `<div class="sim-grid"><div><div class="paper event crisis"><div class="world-badge">⚠ 董事會緊急會議 · 經營權危機</div><h2>有人提案，要你交出負責人的位置。</h2><p class="story">派系衝突已從私下耳語變成正式議案。${state.bossExposed?'你本人的爭議也成了反對派的動員理由。':''}目前派系壓力 ${fmt(state.factionPressure)}。董事支持 ${state.board}、創辦人持股 ${state.equity}%。公司可能繼續存在，但你未必還能坐在這個位置。</p><div class="choices"><button class="choice" data-board-action="negotiate" ${state.cash>=12?'':'disabled'}><span><b>接受改革與補償條件，爭取留任</b><small>支出 12、持股減少 8 個百分點、董事支持恢復至 58；團隊 −6</small></span></button><button class="choice" data-board-action="vote"><span><b>正面表決，保住自己的經營權</b><small>留任率 ${Math.round(boardOdds()*100)}%；失敗就被迫下台</small></span></button><button class="choice" data-board-action="retire"><span><b>主動交棒，宣布退休</b><small>結束本次老闆人生，公司繼續營運</small></span></button></div></div>${timeline()}</div><aside class="right-rail">${governancePanel()}${revenuePanel()}</aside></div>`;}
function resolveBoard(key){if(!state||state.stage!=='board')return;const chance=boardOdds(),before={cash:state.cash,team:state.team,board:state.board};if(key==='retire'){finish('retired','在董事會表決前，你決定主動交棒退休。');return;}let note='';if(key==='negotiate'){if(state.cash<12)return;state.cash-=12;state.equity=Math.max(5,state.equity-8);state.board=58;state.team=Math.max(0,state.team-6);note='你接受改革條件並取得留任，現金 −12、持股 −8 個百分點、團隊 −6。';}else if(key==='vote'){if(random()>=chance){finish('ousted','董事會表決通過撤換你。公司繼續經營，但你的老闆人生在這裡結束。');return;}state.board=62;state.team=Math.max(0,state.team-4);note='董事會表決支持你留任，但派系爭執讓團隊狀態下降 4。';}else return;
state.governanceDue=false;state.factionPressure=clamp(state.factionPressure-18,0,100);state.boardCooldown=2;if(state.result){state.result.financing??=[];state.result.financing.push(note);for(const k of ['cash','team','board'])state.result.delta[k]=(state.result.delta[k]||0)+(state[k]-before[k]);state.history[0]=structuredClone(state.result);}if(state.team<=0){finish('team','派系衝突與改革壓力讓團隊瓦解，公司無法繼續交付。');return;}if(state.cash<19){startCrisis('result');return;}autoAdvance();}
function organisationDashboard(){return `<section class="organisation"><details class="org-card"><summary><span>員工與 13 個職能部門</span><b>${totalStaff()} 人</b></summary><div class="dept-grid">${Object.entries(departments).map(([k,d])=>`<div><span>${d.name}</span><b>${state.staff[k]}<small>人</small></b><p>${d.role}</p><p>執行力 ${Math.round(staffScore(k))} / 100${state.staff[k]===0?' · 職能缺口':''}</p></div>`).join('')}</div><p class="org-caption">年度薪資約 ${payrollCost()} 百萬元 · 招募、離職、縮編都會改變人數與固定費用。</p></details><details class="org-card" open><summary><span>進行中專案</span><b>${state.projects.length} 案 · ${state.products} 款量產</b></summary><div class="project-grid">${state.projects.map(p=>{const c=state.clients.find(c=>c.id===p.clientId);return `<div class="project-item"><div class="project-title"><span>${p.id}</span><b>${esc(p.name)}</b></div><div class="project-meta"><span>${p.status}</span><b>${p.progress}%</b></div><div class="progress"><i style="width:${p.progress}%"></i></div><p>對接 ${c.name} · 研發／應用／品質共同推進${p.lastDelta?` · 本期 ${signed(p.lastDelta)}%`:''}</p></div>`;}).join('')}</div></details><details class="org-card"><summary><span>供應鏈與客戶關係</span><b>上游 ${state.suppliers.length} · 下游 ${state.clients.length}</b></summary><div class="partners-grid">${state.suppliers.map(p=>`<div><small>上游 · ${p.role}</small><b>${p.name}</b><p>信任 ${p.trust} · 產能指標 ${p.capacity}</p><div class="progress"><i style="width:${p.trust}%"></i></div></div>`).join('')}${state.clients.map(p=>`<div><small>下游 · ${p.role}</small><b>${p.name}</b><p>信任 ${p.trust} · 商機 ${p.orders}</p><div class="progress"><i style="width:${p.trust}%"></i></div></div>`).join('')}</div><p class="org-caption">公司與角色均為虛構。信任與供貨能力影響出貨；客戶信任也影響驗證進度。未結治理爭議風險 ${state.conductRisk} / 100。</p></details></section>`;}
function strategyPicker(){return `<div class="strategy-picker"><label for="strategy">本階段經營重心</label><select id="strategy">${[['auto','依公司狀況自動安排'],...Object.entries(focuses).map(([k,f])=>[k,f.name+' · 本期預算 '+focusCost(k)])].map(([k,n])=>`<option value="${k}" ${state.strategy===k?'selected':''} ${focuses[k]&&state.cash<focusCost(k)?'disabled':''}>${n}${focuses[k]&&state.cash<focusCost(k)?' · 資金不足':''}</option>`).join('')}</select><span>本次採用：${focuses[state.pending.key].name} · ${state.pending.days||Math.round(state.pending.months*30.4375)} 天</span></div>`;}
function yearContext(){const w=world[state.year];return w?`<details class="year-context"><summary>◎ ${state.year} 年真實背景 · ${w.title}</summary><p class="hint">${w.text}</p><a class="source" href="${w.url}" target="_blank" rel="noopener">${w.source} ↗</a></details>`:'';}
function lastReport(){const r=state.result;if(!r)return '';return `<details class="last-report"><summary><span>✓ ${r.year} 年 ${r.month||1} 月 ${r.day||1} 日起 · 已推進 ${r.days||Math.round((r.months||12)*30.4375)} 天</span><b>營收 ${fmt(r.revenue??0)} · 資金 ${signed(r.delta.cash)}</b><small>${esc(r.generic?.text||r.focusText)} ${(r.projectNotes||[]).filter(n=>n.includes('已量產')).map(esc).join(' ')}</small></summary><p class="story">${esc(r.eventChoice||r.focusName)}：${esc(r.generic?.text||r.focusText)}</p>${annualFinancials(r)}${changes(r.delta)}${r.storyOutcome?`<p class="hint">劇情影響：${esc(r.storyOutcome.text)}</p>`:''}${[...(r.organisationNotes||[]),...(r.projectNotes||[]),...(r.financing||[])].map(n=>`<p class="hint">${esc(n)}</p>`).join('')}</details>`;}
function modal(html){$('dialogBody').innerHTML=html;if(!$('dialog').open)$('dialog').showModal();}
function validName(v){return v.trim().replace(/[\u0000-\u001f]/g,'').slice(0,24);}
document.addEventListener('change',e=>{if(e.target.id==='strategy')changeStrategy(e.target.value);});
document.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='startForm'){const name=validName($('companyName').value);if(!name){$('nameError').textContent='請輸入公司名稱。';return;}create(name,$('startYear').value);}if(e.target.id==='renameForm'){const name=validName($('newName').value);if(!name)return;state.name=name;save();$('dialog').close();render();}});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.strategy)changeStrategy(b.dataset.strategy);if(b.dataset.boardAction)resolveBoard(b.dataset.boardAction);if(b.hasAttribute('data-confirm-retire')){if(retire())$('dialog').close();}if(b.dataset.eventChoice!==undefined)chooseEvent(Number(b.dataset.eventChoice),b.dataset.eventToken);if(b.hasAttribute('data-defer-event'))deferEvent(b.dataset.eventToken);if(b.dataset.rescue)resolveCrisis(b.dataset.rescue);if(b.dataset.focus)runYear(b.dataset.focus);if(b.hasAttribute('data-auto'))runYear(autoFocus(),true);if(b.hasAttribute('data-next'))nextYear();if(b.hasAttribute('data-begin')&&state.stage==='profile'){prepareAnnualEvent();}if(b.hasAttribute('data-reroll'))create(state.name,state.startYear);if(b.hasAttribute('data-new')){state=null;localStorage.removeItem(KEY);render();window.scrollTo({top:0,behavior:'smooth'});}if(b.hasAttribute('data-close'))$('dialog').close();if(b.hasAttribute('data-confirm-new')){state=null;localStorage.removeItem(KEY);$('dialog').close();render();}});
$('rename').onclick=()=>modal(`<h2>替公司換個名字</h2><form id="renameForm"><input class="input" id="newName" maxlength="24" value="${state?esc(state.name):''}" required><button class="primary" type="submit">儲存</button></form><button class="text-btn" data-close>取消</button>`);
$('restart').onclick=()=>modal('<h2>重新成立公司？</h2><p>目前這一局會被新公司取代。</p><button class="primary" data-confirm-new>重新開始</button><button class="text-btn" data-close>保留目前公司</button>');
$('help').onclick=()=>modal('<h2>一間公司，也有無法選擇的出身。</h2><p>你決定公司名稱與成立年份；系統隨機抽取創辦人背景、起步資金、產品方向、地點與供應鏈條件。</p><p>一年內會發生多個決策事件，每次決策自動推進 2～120 天，期間另有 1～5 件無法選擇的自發事件。員工、客戶、供應商與專案都可能受影響；事件會保留於紀錄。薪資、營收、利息及日常研發進度按實際天數計算，選項列出的代價則為當次一次性影響。本階段策略可以隨時在事件上方調整，改策略不會重抽事件。真實年代新聞與公司事件會同時影響營收。爆單可能帶來成長，砍單、召回與壞帳也會讓公司虧損。也可選「交給命運」由系統依公司狀況自動決策。</p><p>沒有固定公司經營年限；老闆起始年齡隨機為 25～55 歲，年滿 70 歲自動退休。最後一次時間推進會停在退休日。你可以在年度決策或報告畫面按「退休交棒」。上市成功後也能繼續經營；接受收購、被董事會撤換或公司倒閉才會結束。2026 年起是虛構未來推演。畫面右側顯示四家同年成立的模擬公司。它們也會受到景氣與早期風險影響，可能比你更早退場。</p><p>資金低於 19 百萬元會觸發週轉危機，每輪有兩次自救機會。銀行借款、股權募資、縮編或出售產品各有代價；負現金且自救失敗會倒閉。借款每年利息 8%、償還當時本金的 15%。新局起始 36～50 位員工，另備擴編週轉金 35；舊存檔保留既有人數，可透過整批招募擴編。老闆自己的回扣與桃色爭議會累積風險，曝光後降低聲譽與董事信任，增加派系壓力，間接引發內鬥或被迫下台。個人所得與公司現金分開。部門擴充為 13 個職能，原有人數會重新分配而非重複增加；人資會隨時間改善低迷士氣；版圖、驗證、品質等缺口會拖慢量產，法務財務與人資影響決策機率與後續風險。每個事件選項都顯示負責部門、固定影響與執行受阻的代價；決策會留下 14～180 天後進入處理窗口的後續事件，沿用同一合作方。部門員工人數會影響薪資、提案、製程協作及三條專案的進度；專案通過驗證就會量產並補上新案。供應商與客戶的信任、產能及商機會影響營收。公司也可能團隊離散，也可能成為技術冠軍、被策略併購或公開上市。所有進度只儲存在目前瀏覽器。</p><button class="primary" data-close>回到公司</button>');
$('retire').onclick=()=>modal('<h2>你決定退休、交棒了嗎？</h2><p>這會結束本次老闆人生。公司仍可能由接班人繼續經營；退休是你的決定。</p><button class="primary" data-confirm-retire>確認退休，回顧創業人生</button><button class="text-btn" data-close>還想繼續經營</button>');
if(state){graphInit();if(state.pending){state.pending.days??=Math.max(1,Math.round((state.pending.months||2)*365.25/12));state.pending.months=state.pending.days*12/365.25;state.pending.actor??=actorFor(pendingEvent());state.pending.token??=`${state.year}-${++state.decisionSerial}`;if(!state.pending.options||state.optionRulesVersion<4)state.pending.options=drawAlternatives(businessEvents.find(e=>e.id===state.pending.eventId));state.optionRulesVersion=4;state.pending.days=Math.min(state.pending.days,retirementDays());state.pending.months=state.pending.days*12/365.25;}if(state.stage==='turn'&&state.cash<19)startCrisis('turn');else if(state.stage==='turn')prepareAnnualEvent();else if(state.stage==='result')autoAdvance();else if(!checkAgeRetirement())render();save();}else render();
</script></body></html>
